name: OMEGA V6 computation truth proof

on:
  workflow_run:
    workflows: ["OMEGA V6 verify"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-r170:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'omega-v6-full-convergence')
    runs-on: ubuntu-latest
    env:
      V6_URL: https://omegav6.jeffdeweyeljefe.workers.dev
    steps:
      - name: Checkout exact promoted computation source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Fetch live R170 computations
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$V6_URL/api/compute/manifest" -o /tmp/manifest.json \
              && grep -q 'OMEGA_COMPUTATION_TRUTH_R170' /tmp/manifest.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "R170 manifest did not settle on the public edge"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error -X POST "$V6_URL/api/compute/relativity/event" \
            -H 'content-type: application/json' \
            --data '{"t_seconds":1.25,"position_m":[120000000,-25000000,4000000],"frame_velocity_m_s":[40000000,-20000000,10000000]}' \
            -o /tmp/lorentz.json

          curl --fail --silent --show-error -X POST "$V6_URL/api/compute/optics/tmm" \
            -H 'content-type: application/json' \
            --data '{"wavelength_nm":550,"incident_n":1,"substrate_n":1.5,"layers":[{"n":1.224744871391589,"k":0,"thickness_nm":112.26827987756235}]}' \
            -o /tmp/tmm.json

          curl --fail --silent --show-error -X POST "$V6_URL/api/compute/continuity/transfer" \
            -H 'content-type: application/json' \
            --data '{"values":[4,3,2,1],"transfers":[{"from":0,"to":1,"amount":1.25},{"from":1,"to":2,"amount":0.5},{"from":2,"to":3,"amount":0.25}]}' \
            -o /tmp/continuity.json

          curl --fail --silent --show-error -X POST "$V6_URL/api/compute/wave/fdtd1d" \
            -H 'content-type: application/json' \
            --data '{"initial_displacement":[0,0,1,0,0],"wave_speed":1,"dx":1,"dt":0.5,"steps":20}' \
            -o /tmp/wave.json

          curl --fail --silent --show-error "$V6_URL/compute" -o /tmp/compute.html

      - name: Verify equations, invariants, boundaries and receipts
        shell: python
        run: |
          import json, math
          from pathlib import Path

          manifest = json.loads(Path('/tmp/manifest.json').read_text())
          lorentz = json.loads(Path('/tmp/lorentz.json').read_text())
          tmm = json.loads(Path('/tmp/tmm.json').read_text())
          continuity = json.loads(Path('/tmp/continuity.json').read_text())
          wave = json.loads(Path('/tmp/wave.json').read_text())
          lab = Path('/tmp/compute.html').read_text()

          assert manifest['ok'] is True
          assert manifest['schema'] == 'OMEGA_COMPUTATION_TRUTH_R170'
          assert manifest['revision'] == 'R170'
          assert manifest['constants']['c_m_s'] == 299792458
          assert manifest['hierarchy']['addressLevels'] == [12, 144, 1728, 20736]
          assert manifest['hierarchy']['physicalDimensionClaim'] is False
          assert manifest['canonicalMutation'] is False

          lr = lorentz['result']
          assert lorentz['ok'] is True
          assert lr['schema'] == 'OMEGA_LORENTZ_EVENT_R170'
          assert lr['invariant_relative_residual'] < 1e-12
          assert len(lorentz['receipt']['receiptSha256']) == 64
          assert lorentz['receipt']['canonicalMutation'] is False

          op = tmm['result']
          assert tmm['ok'] is True
          assert op['solver'] == 'NORMAL_INCIDENCE_TMM'
          assert op['solverTier'] == 'REDUCED_ORDER_SCREENING'
          assert op['fabricationGrade'] is False
          assert op['reflectance'] < 1e-10
          assert op['energy_balance_residual'] < 1e-12
          assert len(tmm['receipt']['receiptSha256']) == 64

          cr = continuity['result']
          assert continuity['ok'] is True
          assert cr['values_after'] == [2.75, 3.75, 2.25, 1.25]
          assert cr['invariant_absolute_residual'] < 1e-12
          assert cr['canonicalMutation'] is False

          wr = wave['result']
          assert wave['ok'] is True
          assert abs(wr['cfl'] - 0.5) < 1e-15
          assert wr['maxwellSolver'] is False
          assert wr['solver'] == 'SECOND_ORDER_SCALAR_WAVE_FDTD_1D'
          assert all(math.isfinite(x) for x in wr['final_state'])

          assert 'OMEGA · R170 · computation truth' in lab
          assert 'Reference computation you can inspect.' in lab
          assert 'not labeled RCWA/FDTD/FEM' in lab

      - name: Cross-runtime cloud versus Python parity
        shell: python
        run: |
          import json, math, sys
          from pathlib import Path

          sys.path.insert(0, str((Path.cwd() / 'canonforge-omega').resolve()))
          from omega_runtime.advanced_computation import (
              OpticalLayer,
              conservative_transfer,
              lorentz_boost_event,
              normal_incidence_tmm,
              scalar_wave_fdtd_1d,
          )

          cloud_l = json.loads(Path('/tmp/lorentz.json').read_text())['result']
          cloud_o = json.loads(Path('/tmp/tmm.json').read_text())['result']
          cloud_c = json.loads(Path('/tmp/continuity.json').read_text())['result']
          cloud_w = json.loads(Path('/tmp/wave.json').read_text())['result']

          py_l = lorentz_boost_event(1.25, (120000000, -25000000, 4000000), (40000000, -20000000, 10000000))
          py_o = normal_incidence_tmm(550, (OpticalLayer(1.224744871391589, 0, 112.26827987756235),), incident_n=1, substrate_n=1.5)
          py_c = conservative_transfer((4, 3, 2, 1), ((0, 1, 1.25), (1, 2, 0.5), (2, 3, 0.25)))
          py_w = scalar_wave_fdtd_1d((0, 0, 1, 0, 0), wave_speed=1, dx=1, dt=0.5, steps=20)

          def close(a, b, rel=2e-12, abs_=2e-12):
              return abs(a-b) <= max(abs_, rel * max(abs(a), abs(b)))

          assert close(cloud_l['gamma'], py_l.gamma)
          assert close(cloud_l['transformed_t_seconds'], py_l.transformed_t_seconds)
          for a, b in zip(cloud_l['transformed_position_m'], py_l.transformed_position_m): assert close(a, b)
          assert close(cloud_l['interval_before_m2'], py_l.interval_before_m2)
          assert close(cloud_l['interval_after_m2'], py_l.interval_after_m2)

          assert close(cloud_o['reflectance'], py_o.reflectance)
          assert close(cloud_o['transmittance'], py_o.transmittance)
          assert close(cloud_o['absorptance'], py_o.absorptance)
          assert close(cloud_o['energy_balance_residual'], py_o.energy_balance_residual)

          assert all(close(a, b) for a, b in zip(cloud_c['values_after'], py_c.values_after))
          assert close(cloud_c['invariant_absolute_residual'], py_c.invariant_absolute_residual)

          assert close(cloud_w['cfl'], py_w.cfl)
          assert all(close(a, b) for a, b in zip(cloud_w['final_state'], py_w.final_state))

          parity = {
              'status': 'LIVE_R170_CLOUD_PYTHON_PARITY_VERIFIED',
              'lorentz_interval_cloud': cloud_l['invariant_relative_residual'],
              'lorentz_interval_python': py_l.invariant_relative_residual,
              'tmm_reflectance_cloud': cloud_o['reflectance'],
              'tmm_reflectance_python': py_o.reflectance,
              'continuity_residual_cloud': cloud_c['invariant_absolute_residual'],
              'continuity_residual_python': py_c.invariant_absolute_residual,
              'wave_cfl': cloud_w['cfl'],
          }
          print(json.dumps(parity, sort_keys=True))
