name: OMEGA V6 R197 source-grounding proof

on:
  pull_request:
    paths:
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/sai/sourceGroundingR197.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts'
      - 'canonforge-omega/tests/test_r197_source_grounding_fallback.py'
      - 'canonforge-omega/tests/test_r195_drive_corpus_one_system.py'
      - 'canonforge-omega/tests/test_r181_live_ai_sai_sovereign_acceptance.py'
      - '.github/workflows/omega-v6-r197-source-grounding-proof.yml'
  push:
    branches: [omega-v6-full-convergence]
    paths:
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/sai/sourceGroundingR197.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts'
      - 'canonforge-omega/tests/test_r197_source_grounding_fallback.py'
      - '.github/workflows/omega-v6-r197-source-grounding-proof.yml'
  workflow_dispatch:

jobs:
  verify-r197:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Prove R197 authority boundaries and preserved predecessors
        working-directory: canonforge-omega
        run: |
          python -m pytest -q \
            tests/test_r197_source_grounding_fallback.py \
            tests/test_r195_drive_corpus_one_system.py \
            tests/test_r181_live_ai_sai_sovereign_acceptance.py \
            tests/test_r180_b059_sai_swarm_governor_convergence.py \
            tests/test_r196_measured_dewey_calibration.py \
            tests/test_r196_calibration_surface.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck complete Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck
      - name: Wrangler dry-run complete Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npx wrangler deploy --dry-run --outdir .r197-dry-run

  prove-live-r197:
    if: github.event_name == 'push' && github.ref == 'refs/heads/omega-v6-full-convergence'
    needs: verify-r197
    runs-on: ubuntu-latest
    steps:
      - name: Wait for stable exact deployed SHA
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          consecutive=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 20 "$LIVE/api/system/r195/manifest" -o /tmp/manifest.json && EXPECTED_SHA="$EXPECTED_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/manifest.json').read_text())
          assert d.get('canonicalGitSha') == os.environ['EXPECTED_SHA'], d
          PY
            then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then exit 0; fi
            else
              consecutive=0
            fi
            sleep 3
          done
          exit 1
      - name: Prove explicit build-canon source grounding
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          post_live() {
            local url="$1" data="$2" out="$3"
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 20 "$url" -H 'content-type: application/json' --data "$data" -o "$out"; then return 0; fi
              sleep 2
            done
            return 1
          }
          post_live "$LIVE/api/sai/source-query" '{"prompt":"State the OMEGA address hierarchy and its physical-dimension truth boundary."}' /tmp/source.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          d=json.loads(Path('/tmp/source.json').read_text())
          assert d.get('ok') is True, d
          assert d.get('schema') == 'OMEGA_SOURCE_GROUNDED_BUILD_CANON_R197', d
          assert d.get('grounded') is True, d
          assert d.get('source_scope') == 'ADMITTED_LIVE_BUILD_CANON_ONLY', d
          assert d.get('b059_full_corpus_verified') is False, d
          assert d.get('fully_trained_within_declared_scope') is False, d
          assert d.get('foundation_model_weights_trained') is False, d
          assert d.get('sovereign_b059_required_for_full_corpus') is True, d
          assert d.get('evidence_count', 0) > 0, d
          assert re.fullmatch(r'[a-f0-9]{64}', str(d.get('receipt_sha256') or '')), d
          assert '12' in d.get('answer','') and '20736' in d.get('answer',''), d
          assert 'not literal physical dimensions' in d.get('answer','').lower(), d
          PY
      - name: Prove sovereign B059 remains first and 503 fallback is truthfully scoped through One-System
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 20 "$LIVE/api/system/r195/execute" -H 'content-type: application/json' --data '{"operation":"sai.query","prompt":"State the OMEGA address hierarchy and its physical-dimension truth boundary."}' -o /tmp/fallback.json; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json, re
          from pathlib import Path
          p=json.loads(Path('/tmp/fallback.json').read_text())
          assert p.get('schema') == 'OMEGA_ONE_SYSTEM_EXECUTION_RECEIPT_R195', p
          assert p.get('downstreamOk') is True, p
          state=p.get('executionState') or {}
          assert state.get('returned') is True and state.get('verified') is True, state
          assert (p.get('verification') or {}).get('class') == 'SOURCE_GROUNDED_RECEIPT', p
          r=p.get('result') or {}
          assert r.get('grounded') is True, r
          assert r.get('b059_full_corpus_verified') is False, r
          assert r.get('b059_fallback_used') is True, r
          assert r.get('b059_upstream_status') == 503, r
          assert r.get('source_scope') == 'ADMITTED_LIVE_BUILD_CANON_ONLY', r
          assert r.get('sovereign_b059_required_for_full_corpus') is True, r
          assert re.fullmatch(r'[a-f0-9]{64}', str(r.get('receipt_sha256') or '')), r
          assert re.fullmatch(r'[a-f0-9]{64}', str(p.get('receiptSha256') or '')), p
          PY
      - name: Prove unrelated prompts are refused rather than falsely grounded
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 20 -o /tmp/miss.json -w '%{http_code}' "$LIVE/api/sai/source-query" -H 'content-type: application/json' --data '{"prompt":"What is the population of a city not represented in OMEGA build canon?"}')
          test "$code" = "424"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/miss.json').read_text())
          assert d.get('grounded') is False, d
          assert d.get('code') == 'BUILD_CANON_SCOPE_MISS', d
          assert d.get('evidence_count') == 0, d
          assert d.get('b059_full_corpus_verified') is False, d
          PY
