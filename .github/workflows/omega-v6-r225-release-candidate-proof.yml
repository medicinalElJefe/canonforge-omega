name: OMEGA V6 R225 release candidate exact-head proof

on:
  pull_request:
    branches: [omega-v6-full-convergence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-v6-r225-candidate-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  MIN_CANONICAL_SHA: 878f331a38ac01ace480858f9f135e441ad3a1f6

jobs:
  prove-r225-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact head and canonical ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "$MIN_CANONICAL_SHA^{commit}"
          git merge-base --is-ancestor "$MIN_CANONICAL_SHA" HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Full cumulative Python and Cloudflare contract regression
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python scripts/check_cloudflare_contract.py --strict
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck complete canonical Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck

      - name: Dry-run complete canonical Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npx wrangler deploy --dry-run --outdir .r225-release-candidate-dry-run

      - name: Assert candidate proof has no production authority
        shell: bash
        run: |
          set -euo pipefail
          echo 'R225_CANDIDATE_EXACT_HEAD_PROVEN_NO_DEPLOYMENT_AUTHORITY'
