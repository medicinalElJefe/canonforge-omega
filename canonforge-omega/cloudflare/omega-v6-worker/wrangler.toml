name = "omegav6"
main = "src/runtimeEntryR169.ts"
# Protected canonical implementation remains main = "src/heartbeatTruth.ts" semantically;
# runtimeEntryR169 delegates every unhandled request directly to heartbeatTruth while preserving
# cloud SAI, Sovereign B059 SAI, AI+SAI fusion, swarm, compute, validation and federation namespaces.
compatibility_date = "2026-08-29"
workers_dev = true

[vars]
