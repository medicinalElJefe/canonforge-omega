name: OMEGA Genesis Verify
on:
  push:
    branches: [omega-genesis-v1-full]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: pip install -e .
      - run: python -m compileall -q omega_genesis
      - run: pytest
      - run: python scripts/verify_release.py
