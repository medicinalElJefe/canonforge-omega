name: OMEGA V6 R185 live 172-cloud proof

on:
  workflow_run:
    workflows: ["OMEGA V6 release-forward exact-head production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-r185-live-172-cloud-proof
  cancel-in-progress: true

jobs:
  verify-live-172-cloud-federation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'omega-v6-full-convergence')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V6_URL: https://omegav6.jeffdeweyeljefe.workers.dev
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact proved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact canonical identity and all 172 advertised R185 links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r185-live-proof
          python canonforge-omega/scripts/verify_r185_live_federation.py \
            --base "$V6_URL" \
            --expected-sha "$EXPECTED_SHA" \
            --output-dir /tmp/r185-live-proof \
            --workers 12
          echo "R185_POST_RELEASE_172_CLOUD_FEDERATION_VERIFIED=$EXPECTED_SHA"

      - name: Publish exact 172-link and proof inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-r185-172-cloud-proof-${{ github.run_id }}
          path: /tmp/r185-live-proof/
          if-no-files-found: warn
