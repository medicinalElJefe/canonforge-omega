name: OMEGA Recursive Resolution Proof

on:
  pull_request:
    paths:
      - "canonforge-omega/omega_fusion_core/intrinsic_skin.py"
      - "canonforge-omega/omega_fusion_core/recursive_resolution.py"
      - "canonforge-omega/omega_fusion_core/resolution_graph.py"
      - "canonforge-omega/omega_fusion_core/__init__.py"
      - "canonforge-omega/tests/test_intrinsic_skin.py"
      - "canonforge-omega/tests/test_recursive_resolution.py"
      - "canonforge-omega/tests/test_resolution_graph.py"
      - "canonforge-omega/docs/INTRINSIC_SKIN_COMPUTE.md"
      - "canonforge-omega/docs/RECURSIVE_RESOLUTION_CALCULUS.md"
      - ".github/workflows/recursive-resolution-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: canonforge-omega
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Compile recursive kernel
        run: |
          python -m py_compile omega_fusion_core/intrinsic_skin.py
          python -m py_compile omega_fusion_core/recursive_resolution.py
          python -m py_compile omega_fusion_core/resolution_graph.py
          python -m py_compile omega_fusion_core/__init__.py

      - name: Prove intrinsic skin + recursive resolution contracts
        run: pytest -q tests/test_intrinsic_skin.py tests/test_recursive_resolution.py tests/test_resolution_graph.py

      - name: Import proof
        run: |
          python - <<'PY'
          import omega_fusion_core as omega
          assert omega.Authority.MEASURED > omega.Authority.DERIVED_STANDARD
          assert omega.Authority.DERIVED_STANDARD > omega.Authority.DERIVED_LENS
          assert omega.Authority.DERIVED_LENS > omega.Authority.HYPOTHESIS
          assert omega.PromotionLevel.LENS.value == "LENS"
          print("OMEGA recursive resolution import proof: PASS")
          PY
