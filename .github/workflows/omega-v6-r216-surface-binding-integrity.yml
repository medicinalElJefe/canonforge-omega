name: OMEGA V6 R216 surface binding integrity

on:
  pull_request:
    branches: [omega-v6-full-convergence]
  push:
    branches: [omega-v6-full-convergence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r216-surface-binding-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install proof dependency
        run: python -m pip install -U pytest

      - name: Prove fail-closed surface contract
        working-directory: canonforge-omega
        run: python -m pytest -q tests/test_r216_surface_binding_integrity.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck preserved R169 entrypoint plus R216 interlock
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck

      - name: Prove production package without mutation
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npx wrangler deploy --dry-run --outdir .r216-dry-run

      - name: Assert R169 execution authority remains the real entrypoint
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'main = "src/runtimeEntryR169.ts"' canonforge-omega/cloudflare/omega-v6-worker/wrangler.toml
          grep -F 'import canonicalRuntime from "./heartbeatTruth"' canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts
          grep -F 'import { enhanceSurfaceBindingIntegrityR216 } from "./surfaceBindingIntegrityR216"' canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts
          grep -F 'return enhanceSurfaceBindingIntegrityR216(r205, env?.CANONICAL_GIT_SHA ?? null)' canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts
          grep -F '/api/system/r211/status' canonforge-omega/cloudflare/omega-v6-worker/src/surfaceBindingIntegrityR216.ts
          grep -F '/api/system/r205/health' canonforge-omega/cloudflare/omega-v6-worker/src/surfaceBindingIntegrityR216.ts
          grep -F 'CONTROLS WITHHELD' canonforge-omega/cloudflare/omega-v6-worker/src/surfaceBindingIntegrityR216.ts
