name: OMEGA Genesis Cloudflare deploy
on:
  push:
    branches: [omega-genesis-v1-full]
    paths:
      - 'cloudflare/omega-genesis-worker/**'
      - 'web/**'
      - '.github/workflows/deploy-genesis-cloudflare.yml'
      - 'release/**'
  workflow_run:
    workflows: ['OMEGA Governed Self-Build']
    types: [completed]
    branches: [omega-genesis-v1-full]
  workflow_dispatch:

concurrency:
  group: omega-genesis-cloudflare
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: omega-genesis-v1-full
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify canonical deployment event authority
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BRANCH: ${{ github.ref_name }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          HEAD_BRANCH="$PUSH_BRANCH"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            HEAD_BRANCH="$WORKFLOW_HEAD_BRANCH"
          fi
          python -m omega_genesis.deployment_event \
            --event-name "$EVENT_NAME" \
            --head-branch "$HEAD_BRANCH" \
            --workflow-name "$WORKFLOW_NAME" \
            --workflow-conclusion "$WORKFLOW_CONCLUSION"
      - name: Verify Genesis core
        run: |
          python -m pip install -U pip pytest
          python -m pip install -e .
          python -m pytest -q
          python scripts/build_manifest.py
          python scripts/verify_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: cloudflare/omega-genesis-worker
        run: npm install
      - name: Check Worker syntax
        working-directory: cloudflare/omega-genesis-worker
        run: npm run check
      - name: Deploy and prove service-bound R191 + Optical R153.2, or roll back safely
        id: deploy
        working-directory: cloudflare/omega-genesis-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "BLOCKED_CREDENTIALS: core + Worker checks passed; Cloudflare credentials are required to promote omega-genesis-v1." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deployment_status=BLOCKED_CREDENTIALS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEPLOY_LOG="$(mktemp)"
          if ! npx wrangler deploy 2>&1 | tee "$DEPLOY_LOG"; then
            echo "DEPLOY_FAILED: Wrangler did not publish a candidate." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          PUBLIC_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$DEPLOY_LOG" | tail -n 1 || true)"
          if [ -z "$PUBLIC_URL" ]; then
            echo "DEPLOY_UNVERIFIED: Wrangler returned success but no workers.dev URL could be proven from deploy output." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "OMEGA Genesis candidate: $PUBLIC_URL" | tee -a "$GITHUB_STEP_SUMMARY"

          verify_core() {
            local health_file api_file
            health_file="$(mktemp)"
            api_file="$(mktemp)"
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
              "$PUBLIC_URL/_omega/health" -o "$health_file" || return 1
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
              "$PUBLIC_URL/api/health" -o "$api_file" || return 1
            python - "$health_file" "$api_file" <<'PY'
          import json, sys
          health = json.load(open(sys.argv[1], encoding="utf-8"))
          api = json.load(open(sys.argv[2], encoding="utf-8"))
          assert health.get("ok") is True, health
          assert health.get("authority") == "durable-object-canonical", health
          assert api.get("status") == "OK", api
          assert api.get("runtime") == "OMEGA_GENESIS_CLOUD", api
          assert isinstance(api.get("canonical_digest"), str) and len(api["canonical_digest"]) == 64, api
          assert api.get("proof", {}).get("valid") is True, api
          assert api.get("replay", {}).get("valid") is True, api
          assert api.get("replay", {}).get("current_digest") == api.get("canonical_digest"), api
          PY
          }

          verify_candidate() {
            local fabric_file page_file
            verify_core || return 1
            fabric_file="$(mktemp)"
            page_file="$(mktemp)"
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
              "$PUBLIC_URL/api/fabric/r191" -o "$fabric_file" || return 1
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
              "$PUBLIC_URL/" -o "$page_file" || return 1
            python - "$fabric_file" "$page_file" <<'PY'
          import json, sys
          from pathlib import Path
          fabric = json.load(open(sys.argv[1], encoding="utf-8"))
          page = Path(sys.argv[2]).read_text(encoding="utf-8")
          assert fabric.get("schema") == "OMEGA_GENESIS_SURFACE_FABRIC_OBSERVER_R191", fabric
          assert fabric.get("role") == "GENESIS_DISCOVERY_EVOLUTION_OBSERVER", fabric
          assert fabric.get("federation_verb") == "PROPOSE", fabric
          assert fabric.get("canonical_authority") == "OMEGA_V6_ONLY", fabric
          assert fabric.get("machine_transport") == "CLOUDFLARE_SERVICE_BINDINGS", fabric
          assert fabric.get("required_bindings") == ["OMEGA_V6", "OMEGA_OPTICAL"], fabric
          assert fabric.get("service_bindings_active") is True, fabric
          assert fabric.get("may_mutate_global_canon_state") is False, fabric
          assert fabric.get("may_promote_v6") is False, fabric
          assert fabric.get("may_claim_vercel_same_url_promotion") is False, fabric
          assert fabric.get("ok") is True, fabric
          assert fabric.get("canonical_fabric_ready") is True, fabric
          assert fabric.get("canonical_capability_groups") == 63, fabric
          assert isinstance(fabric.get("canonical_git_sha"), str) and len(fabric["canonical_git_sha"]) == 40, fabric
          assert fabric.get("optical_machine_generation") == "R153.2", fabric
          assert fabric.get("optical_machine_authority") == "SCREEN_ONLY", fabric
          assert fabric.get("optical_machine_version") == "R153.2", fabric
          assert fabric.get("optical_tool_version") == "R153.2", fabric
          assert fabric.get("optical_adaptive_cycle") is True, fabric
          assert fabric.get("optical_canonical_mutation") is False, fabric
          assert "SCREEN_ONLY" in fabric.get("optical_truth_boundary", ""), fabric
          for key in ("fabric", "canon", "optical"):
              assert fabric["observations"][key].get("transport") == "cloudflare_service_binding", fabric
              assert fabric["observations"][key].get("reachable") is True, fabric
          assert "omega-r191-genesis-bar" in page, page[:500]
          assert "GENESIS · PROPOSE" in page, page[:500]
          assert "Optical R153.2" in page, page[:500]
          assert "Canon remains OMEGA V6" in page, page[:500]
          PY
          }

          if verify_candidate; then
            echo "deployment_status=LIVE_VERIFIED" >> "$GITHUB_OUTPUT"
            echo "LIVE_VERIFIED: $PUBLIC_URL passed inherited state/proof/replay plus native service-bound R191 V6 and live-proven Optical R153.2 SCREEN_ONLY/adaptive-tool checks." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "POST_DEPLOY_VERIFY_FAILED: attempting bounded rollback to the immediately previous Worker version." | tee -a "$GITHUB_STEP_SUMMARY"
          if ! npx wrangler rollback --message "OMEGA automatic rollback: R191 + R153.2 service-bound verification failed"; then
            echo "QUARANTINE: candidate failed verification and automatic rollback could not be completed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if verify_core; then
            echo "deployment_status=ROLLBACK_VERIFIED" >> "$GITHUB_OUTPUT"
            echo "ROLLBACK_VERIFIED: predecessor restored and passed its inherited core health/proof/replay contract." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "QUARANTINE: rollback completed but the restored predecessor failed its inherited core health/proof/replay contract." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
