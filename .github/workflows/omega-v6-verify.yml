name: OMEGA V6 verify

on:
  push:
    branches: [omega-v6-full-convergence, omega-v6-fresh-full]
  pull_request:
    paths:
      - 'canonforge-omega/**'
      - '.github/workflows/omega-v6-verify.yml'

jobs:
  sovereign-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Compile all authorities
        working-directory: canonforge-omega
        run: python -m compileall -q omega_runtime api omega_144d_core omega_fusion_core
      - name: Full runtime regression suite
        working-directory: canonforge-omega
        run: python -m pytest -q
      - name: Import FastAPI authority
        working-directory: canonforge-omega
        run: |
          python - <<'PY'
          from api.app import app, health, system_manifest, system_quality, omega_graph_summary
          assert app.title == 'OMEGA V6 Sovereign Runtime'
          assert health()['ok'] is True
          assert system_manifest()['summary']['complete_manifest'] is True
          assert system_quality()['pass'] is True
          assert omega_graph_summary()['node_count'] == 20736
          assert omega_graph_summary()['directed_edge_count'] == 145152
          PY

  cloudflare-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and typecheck
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck
