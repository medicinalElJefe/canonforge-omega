name: OMEGA V6 visual delivery proof

# Historical preservation tokens only — never required in current root HTML:
# r143-ultra-quality-view
# omegaIndividualSkinRelativity
# omegaUltraQualityView
# orsfUltraQuality
# root+micro-macro-skin+ultra-quality+phase+integrity-v3
# PUBLIC_VISUAL_DELIVERY_VERIFIED
# /?view=Field&delivery_probe=$GITHUB_SHA

on:
  push:
    branches: [omega-v6-full-convergence]
  workflow_dispatch:

jobs:
  prove-public-visual:
    runs-on: ubuntu-latest
    concurrency:
      group: omega-v6-visual-proof
      cancel-in-progress: true
    steps:
      - name: Verify public Intelligence carries inspectable route-to-generation runtime
        shell: bash
        env:
          V6_URL: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_VISUAL_RELEASE: r149-intelligence-reasoning-pipeline
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --retry 2 --retry-delay 1 --retry-all-errors -D /tmp/v6-root.headers "$V6_URL/?view=Intelligence&delivery_probe=$GITHUB_SHA" -o /tmp/v6-root.html || true
            if EXPECTED_VISUAL_RELEASE="$EXPECTED_VISUAL_RELEASE" python - <<'PY'
          import os
          from pathlib import Path
          html = Path('/tmp/v6-root.html').read_text(errors='ignore') if Path('/tmp/v6-root.html').exists() else ''
          headers = Path('/tmp/v6-root.headers').read_text(errors='ignore').lower() if Path('/tmp/v6-root.headers').exists() else ''
          release = os.environ['EXPECTED_VISUAL_RELEASE']
          required = [
              f'content="{release}"',
              'omegaRootSovereignField',
              'omegaGovernedModeAtlasRuntime',
              'omegaUnifiedMotionRelativityRuntime',
              'omegaMemoryContinuityRuntime',
              'omegaIntelligenceReasoningRuntime',
              'Route → Mode → Forecast → Action → Gate',
              'INSPECT ROUTE',
              'GENERATE FROM ADMITTED ROUTE',
              'route-before-generation',
              'SIMULATED_CONTINUATION',
              'MODEL_OUTPUT',
              '/api/omega/state',
              '/api/route-preview',
              '/api/chat',
              'finite_difference + RK2 integral curves',
              '478,922',
              '20,736',
              'atlas_context',
              'USER_DEFINED_MODEL',
              'omegaVisualRuntimeIntegrity',
              '61,917,364,224',
          ]
          forbidden = ['omegaIndividualSkinRelativity','omegaUltraQualityView','orsfUltraQuality','omegaMicroMacroGeometry','omegaSymmetryBalance']
          if not all(item in html for item in required): raise SystemExit(1)
          if any(item in html for item in forbidden): raise SystemExit(1)
          if f'x-omega-visual-release: {release}' not in headers: raise SystemExit(1)
          if 'x-omega-visual-contract: single-surface+native-20736-atlas+calculus-field+rk2-flow+memory-continuity+intelligence-route-mode-forecast-action-gate+runtime-truth+integrity-v6' not in headers: raise SystemExit(1)
          if 'cache-control: no-store, no-cache, must-revalidate' not in headers: raise SystemExit(1)
          PY
            then
              ok=true
              echo "PUBLIC_INTELLIGENCE_REASONING_VERIFIED release=$EXPECTED_VISUAL_RELEASE sha=$GITHUB_SHA"
              break
            fi
            echo "Visual edge not settled on $EXPECTED_VISUAL_RELEASE yet ($attempt/60)."
            sleep 2
          done
          if [ "$ok" != "true" ]; then
            echo "PUBLIC_INTELLIGENCE_REASONING_FAILED"
            exit 1
          fi
