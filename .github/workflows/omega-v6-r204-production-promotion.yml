name: OMEGA V6 R204 exact-head Cloudflare production promotion

on:
  pull_request:
    branches: [omega-v6-full-convergence]
    paths:
      - .github/workflows/omega-v6-r204-production-promotion.yml
  push:
    branches: [omega-v6-full-convergence]
    paths:
      - .github/workflows/omega-v6-r204-production-promotion.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-r204-production
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: omega-v6-full-convergence
  R204_RUNTIME_BASE_SHA: 086a5eeb92487d8354542b56a16d9884eb154022
  CONTROL_PATH: .github/workflows/omega-v6-r204-production-promotion.yml
  V6_URL: https://omegav6.jeffdeweyeljefe.workers.dev

jobs:
  prove-control-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion candidate exactly
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove R204 ancestry and control-only delta
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$R204_RUNTIME_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$R204_RUNTIME_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$R204_RUNTIME_BASE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$CONTROL_PATH"
          git diff --quiet "$R204_RUNTIME_BASE_SHA" HEAD -- \
            canonforge-omega/cloudflare/omega-v6-worker \
            canonforge-omega/omega_runtime \
            canonforge-omega/api \
            canonforge-omega/config \
            canonforge-omega/scripts \
            canonforge-omega/tests
          echo "R204_CONTROL_ONLY_DELTA_VERIFIED $R204_RUNTIME_BASE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-prove full inherited OMEGA runtime
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python scripts/check_cloudflare_contract.py --strict
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm install

      - name: Typecheck exact R204 cumulative Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm run typecheck

      - name: Dry-run exact R204 Worker without production mutation
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npx wrangler deploy --dry-run

  deploy-exact-canonical-head:
    if: github.event_name == 'push' && github.ref == 'refs/heads/omega-v6-full-convergence'
    needs: prove-control-and-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact promotion merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact canonical merge lineage before Cloudflare mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$CANONICAL_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t parents < <(git show -s --format='%P' "$GITHUB_SHA" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$R204_RUNTIME_BASE_SHA"
          git merge-base --is-ancestor "$R204_RUNTIME_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$R204_RUNTIME_BASE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$CONTROL_PATH"
          git fetch --no-tags origin "$CANONICAL_BRANCH"
          test "$(git rev-parse "origin/$CANONICAL_BRANCH")" = "$GITHUB_SHA"
          echo "R204_EXACT_TWO_PARENT_CANONICAL_MERGE_VERIFIED $GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-prove release-lineage and Durable Object contract on canonical merge
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python scripts/check_cloudflare_contract.py --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm install

      - name: Capture pre-deploy live baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r204-baseline
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 \
            "$V6_URL/_omega/health" -o /tmp/r204-baseline/health.json
          for spec in \
            'r203:/api/mission/r203/manifest' \
            'r202:/api/system/r202/manifest' \
            'r201:/api/mission/r201/manifest'; do
            name="${spec%%:*}"; path="${spec#*:}"
            curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 \
              "$V6_URL$path" -o "/tmp/r204-baseline/$name.json" || true
          done
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/r204-baseline/health.json').read_text())
          assert h.get('ok') is not False, h
          summary={'healthOk': h.get('ok', True)}
          for n in ('r203','r202','r201'):
              p=Path(f'/tmp/r204-baseline/{n}.json')
              if p.exists():
                  try:
                      d=json.loads(p.read_text())
                      summary[n]={'schema': d.get('schema'), 'release': d.get('release'), 'canonicalGitSha': d.get('canonicalGitSha')}
                  except Exception:
                      summary[n]={'parse': 'failed'}
          Path('/tmp/r204-baseline/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY

      - name: Bind deployment identity to exact canonical SHA without source mutation
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path('wrangler.toml').read_text(encoding='utf-8')
          marker = '[vars]\n'
          assert marker in source
          assert 'CANONICAL_GIT_SHA =' not in source
          sha = os.environ['GITHUB_SHA']
          promoted = source.replace(marker, marker + f'CANONICAL_GIT_SHA = "{sha}"\n', 1)
          Path('wrangler.r204-promotion.toml').write_text(promoted, encoding='utf-8')
          PY
          grep -F "CANONICAL_GIT_SHA = \"$GITHUB_SHA\"" wrangler.r204-promotion.toml
          git diff --exit-code -- wrangler.toml

      - name: Dry-run exact promotion config
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --config wrangler.r204-promotion.toml

      - name: Final exact-head check immediately before deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/$CANONICAL_BRANCH")" = "$GITHUB_SHA"

      - name: Deploy exact canonical R204 Worker to Cloudflare
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.r204-promotion.toml

      - name: Prove live R204 identity and preserved R203-R201 continuity
        id: liveproof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 30 "$V6_URL/api/system/r204/manifest" -o /tmp/r204-manifest.json \
              && curl --fail --silent --show-error --max-time 30 "$V6_URL/api/mission/r203/manifest" -o /tmp/r203-manifest.json \
              && curl --fail --silent --show-error --max-time 30 "$V6_URL/api/system/r202/manifest" -o /tmp/r202-manifest.json \
              && curl --fail --silent --show-error --max-time 30 "$V6_URL/api/mission/r201/manifest" -o /tmp/r201-manifest.json \
              && curl --fail --silent --show-error --max-time 30 "$V6_URL/api/mission/r201/verify" -o /tmp/r201-verify.json \
              && curl --fail --silent --show-error --max-time 30 "$V6_URL/_omega/health" -o /tmp/r204-health.json \
              && EXPECTED_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os, re
          from pathlib import Path
          def load(name): return json.loads(Path(name).read_text())
          r204=load('/tmp/r204-manifest.json')
          r203=load('/tmp/r203-manifest.json')
          r202=load('/tmp/r202-manifest.json')
          r201=load('/tmp/r201-manifest.json')
          verify=load('/tmp/r201-verify.json')
          health=load('/tmp/r204-health.json')
          sha=os.environ['EXPECTED_SHA']
          assert r204.get('ok') is True, r204
          assert r204.get('schema') == 'OMEGA_VERIFIED_HYBRID_RETURN_MANIFEST_R204', r204
          assert r204.get('release') == 'r204-verified-hybrid-return-admission', r204
          assert r204.get('canonicalGitSha') == sha, r204
          assert re.fullmatch(r'[0-9a-f]{64}', str(r204.get('receiptSha256',''))), r204
          arch=r204.get('architecture') or {}
          assert arch.get('canonicalEntrypoint') == 'src/runtimeEntryR169.ts', arch
          assert arch.get('storageIdentityChanged') is False, arch
          assert arch.get('newDurableNamespaceCreated') is False, arch
          bounds=r204.get('truthBoundaries') or {}
          for key in ('authenticatedAgentIsNotHardwareAttestation','hostHashAloneIsNotAuthority','returnedIsNotVerified','verifiedReturnIsNotCanonState','verifiedReturnIsNotPromotion','verifiedFailureDoesNotCompleteMission'):
              assert bounds.get(key) is True, (key,bounds)
          assert r204.get('canonicalMutation') is False and r204.get('hostStateMutation') is False and r204.get('promotionAuthorized') is False, r204
          assert r203.get('ok') is True and r203.get('schema') == 'OMEGA_HYBRID_MISSION_CONTINUITY_MANIFEST_R203', r203
          assert r203.get('release') == 'r203-r201-anchored-r202-aware-hybrid-mission-continuity', r203
          assert r203.get('canonicalGitSha') == sha, r203
          assert r203.get('canonicalHybridBinding') == 'OMEGA_RUNTIME', r203
          assert r203.get('bridgeAuthorizationBypass') is False and r203.get('blindRetryAuthorized') is False, r203
          assert r202.get('ok') is True and r202.get('canonicalGitSha') == sha, r202
          assert r201.get('ok') is True and r201.get('durableBinding') == 'OMEGA_MISSION_LEDGER_R201', r201
          assert r201.get('authority') == 'DURABLE_EVIDENCE_HISTORY_NOT_HOSTSTATE_NOT_CANONSTATE', r201
          assert verify.get('ok') is True and verify.get('verified') is True and verify.get('failures') == [], verify
          assert health.get('ok') is not False, health
          PY
            then matched=true; break; fi
            sleep 3
          done
          test "$matched" = true
          echo "R204_LIVE_IDENTITY_AND_CONTINUITY_VERIFIED $GITHUB_SHA"

      - name: Roll back immediately if live R204 proof failed
        if: steps.liveproof.outcome != 'success'
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'R204_POST_DEPLOY_PROOF_FAILED: rolling back immediately.'
          npx wrangler rollback --message 'OMEGA R204 automatic rollback: live identity/continuity proof failed'
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors --max-time 30 \
            "$V6_URL/_omega/health" -o /tmp/r204-rollback-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/r204-rollback-health.json').read_text())
          assert d.get('ok') is not False, d
          print('R204_ROLLBACK_HEALTH_VERIFIED')
          PY
          exit 1

      - name: Upload R204 live production proof packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-r204-live-production-proof-${{ github.run_id }}
          path: |
            /tmp/r204-baseline/
            /tmp/r204-manifest.json
            /tmp/r203-manifest.json
            /tmp/r202-manifest.json
            /tmp/r201-manifest.json
            /tmp/r201-verify.json
            /tmp/r204-health.json
            /tmp/r204-rollback-health.json
          if-no-files-found: ignore

      - name: Publish R204 production proof summary
        if: steps.liveproof.outcome == 'success'
        shell: bash
        run: |
          {
            echo '## OMEGA V6 R204 exact-head Cloudflare promotion'
            echo
            echo "- Deployed canonical SHA: \`$GITHUB_SHA\`"
            echo "- Runtime base SHA: \`$R204_RUNTIME_BASE_SHA\`"
            echo '- Promotion commit runtime delta: `false`'
            echo '- Canonical two-parent merge lineage: verified'
            echo '- Observed Durable Object contract: verified'
            echo '- R204 live release identity + SHA-256 manifest receipt: verified'
            echo '- R169 canonical entrypoint/storage identity preservation: verified'
            echo '- R203 authenticated Hybrid mission continuity: verified'
            echo '- R202 continuity/potential release identity: verified'
            echo '- R201 durable evidence manifest + chain verification: verified'
            echo '- Historical heartbeat authority: reachable'
            echo '- Failed post-deploy proof policy: automatic Wrangler rollback'
          } >> "$GITHUB_STEP_SUMMARY"
