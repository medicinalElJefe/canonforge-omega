name: OMEGA V6 verify

# Inherited proof identity retained for R86/R128 continuity:
# LIVE_CONVERGENCE_VERIFIED__ROLE_SEPARATED_V3
# R213 boundary: this workflow verifies source and external machine organs only.
# Exact-head production mutation is owned solely by omega-v6-release-forward-production.yml.

on:
  push:
    branches: [omega-v6-full-convergence]
  pull_request:
    paths:
      - 'canonforge-omega/**'
      - 'docs/**'
      - '.github/workflows/omega-v6-verify.yml'
      - '.github/workflows/omega-v6-release-forward-production.yml'

permissions:
  contents: read

jobs:
  sovereign-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Compile
        working-directory: canonforge-omega
        run: python -m compileall -q omega_runtime api omega_144d_core omega_fusion_core
      - name: Full runtime tests
        working-directory: canonforge-omega
        run: python -m pytest -q
      - name: Import FastAPI authority
        working-directory: canonforge-omega
        run: python -c "from api.app import app; assert app.title == 'OMEGA V6 Sovereign Runtime'"

  cloudflare-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and typecheck
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck

  federated-machine-services:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed Genesis and Optical machine organs
        shell: bash
        env:
          GENESIS_MACHINE_URL: https://omega-genesis-machine-r115.jeffdeweyeljefe.workers.dev
          OPTICAL_MACHINE_URL: https://omega-optical-machine-r115.jeffdeweyeljefe.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 1 --retry-all-errors "$GENESIS_MACHINE_URL/api/health" -o /tmp/genesis-machine.json
          curl --fail --silent --show-error --retry 4 --retry-delay 1 --retry-all-errors "$OPTICAL_MACHINE_URL/api/health" -o /tmp/optical-machine.json
          python - <<'PY'
          import json
          from pathlib import Path
          genesis = json.loads(Path('/tmp/genesis-machine.json').read_text())
          optical = json.loads(Path('/tmp/optical-machine.json').read_text())
          assert genesis.get('ok') is True, genesis
          assert genesis.get('service') == 'omega-genesis-machine-r115', genesis
          assert genesis.get('authority') == 'PROPOSE_ONLY', genesis
          assert optical.get('ok') is True, optical
          assert optical.get('service') == 'omega-optical-machine-r115', optical
          assert optical.get('authority') == 'SCREEN_ONLY', optical
          print(json.dumps({
              'status': 'R174_MACHINE_ORGANS_REACHABLE',
              'genesis': genesis.get('version'),
              'optical': optical.get('version'),
          }, sort_keys=True))
          PY

  promotion-compatibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/omega-v6-full-convergence'
    needs: [sovereign-core, cloudflare-interface, federated-machine-services]
    runs-on: ubuntu-latest
    outputs:
      compatible: ${{ steps.contract.outputs.compatible }}
      status: ${{ steps.contract.outputs.status }}
    steps:
      - name: Checkout exact verified head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: contract
        name: Preserve observed live Durable Object contract
        working-directory: canonforge-omega
        shell: bash
        run: |
          result="$(python scripts/check_cloudflare_contract.py)"
          echo "$result"
          RESULT="$result" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          value = json.loads(os.environ["RESULT"])
          print("compatible=" + str(bool(value["compatible"])).lower())
          print("status=" + value["status"])
          PY
      - name: Explain compatibility hold
        if: steps.contract.outputs.compatible != 'true'
        run: echo "VERIFICATION HOLD - candidate does not preserve the observed live OmegaRuntime Durable Object export. Production is not mutated here."

  release-authority-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/omega-v6-full-convergence'
    needs: [sovereign-core, cloudflare-interface, federated-machine-services, promotion-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert single production authority
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/omega-v6-release-forward-production.yml
          grep -F 'name: OMEGA V6 release-forward exact-head production' .github/workflows/omega-v6-release-forward-production.yml
          echo 'OMEGA_V6_VERIFY_PROOF_ONLY_R213'
          echo 'The general verify workflow does not mutate production. Release-forward owns the exact-head deployment and rollback transaction.'
