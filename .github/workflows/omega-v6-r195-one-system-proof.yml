name: OMEGA V6 R195 One-System proof

on:
  pull_request:
    paths:
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/system/**'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/compute/deweyWaterContinuityR195.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/deweyComputeSurfaceR195.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/acceptance/cumulativeCapabilityR195.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/wrangler.toml'
      - 'canonforge-omega/tests/test_r195_drive_corpus_one_system.py'
      - 'canonforge-omega/tests/test_r195_residual_restoration_planner.py'
      - 'canonforge-omega/tests/test_r195_dewey_water_continuity_compute.py'
      - '.github/workflows/omega-v6-r195-one-system-proof.yml'
  push:
    branches: [omega-v6-full-convergence]
    paths:
      - 'canonforge-omega/**'
      - '.github/workflows/omega-v6-r195-one-system-proof.yml'
  workflow_dispatch:

jobs:
  verify-r195:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sovereign test dependencies
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Verify unified R195 through preserved predecessor chain
        working-directory: canonforge-omega
        run: |
          python -m pytest -q \
            tests/test_r195_drive_corpus_one_system.py \
            tests/test_r195_residual_restoration_planner.py \
            tests/test_r195_dewey_water_continuity_compute.py \
            tests/test_r194_evidence_plane_restoration.py \
            tests/test_r193_full_restoration_workspace.py \
            tests/test_r192_navigation_home_repair.py \
            tests/test_r191_universal_surface_fabric.py \
            tests/test_r190_whole_system_acceptance.py \
            tests/test_r189_whole_instrument_convergence.py \
            tests/test_r188_motion_time.py \
            tests/test_r185_172_cloud_federation.py \
            tests/test_r181_live_ai_sai_sovereign_acceptance.py \
            tests/test_r175_independent_solver_validation.py \
            tests/test_r167_authoritative_state_accuracy.py \
            tests/test_r163_visual_delivery_contract.py \
            tests/test_r153_mobile_workspace_orchestration.py \
            tests/test_r145_governed_mode_atlas.py \
            tests/test_role_separated_convergence_r128.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck complete Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck
      - name: Wrangler dry-run complete Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npx wrangler deploy --dry-run --outdir .r195-dry-run

  prove-live-r195:
    if: github.event_name == 'push' && github.ref == 'refs/heads/omega-v6-full-convergence'
    needs: verify-r195
    runs-on: ubuntu-latest
    steps:
      - name: Wait for stable exact deployed R195 SHA
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          consecutive=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 20 "$LIVE/api/system/r195/manifest" -o /tmp/manifest.json && EXPECTED_SHA="$EXPECTED_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          try: d=json.loads(Path('/tmp/manifest.json').read_text())
          except Exception: raise SystemExit(1)
          if d.get('canonicalGitSha') != os.environ['EXPECTED_SHA']: raise SystemExit(1)
          PY
            then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then matched=true; break; fi
            else
              consecutive=0
            fi
            sleep 3
          done
          test "$matched" = true
      - name: Prove corpus, evidence, residual restoration, cumulative truth and One-System workspace
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_SHA: ${{ github.sha }}
          SHA256: 8b66519d36387f3a9ca3f9a10a7dd5da0b806c4fc7b29d9a4353e94e9859e655
        shell: bash
        run: |
          set -euo pipefail
          get_live() {
            local url="$1" out="$2" headers="${3:-}"
            for attempt in $(seq 1 15); do
              if [ -n "$headers" ]; then
                if curl --fail --silent --show-error --max-time 20 -D "$headers" "$url" -o "$out"; then return 0; fi
              else
                if curl --fail --silent --show-error --max-time 20 "$url" -o "$out"; then return 0; fi
              fi
              sleep 2
            done
            return 1
          }
          get_live "$LIVE/api/system/r195/manifest" /tmp/manifest.json
          get_live "$LIVE/api/system/r195/status" /tmp/status.json
          get_live "$LIVE/api/system/r195/restoration?limit=24" /tmp/restoration.json
          get_live "$LIVE/api/canon/r195/manifest" /tmp/canon.json
          get_live "$LIVE/api/workspace/r194/status" /tmp/evidence.json
          get_live "$LIVE/api/system/r195/registry?limit=1" /tmp/registry.json
          get_live "$LIVE/api/system/r195/analyze?table=registry&limit=1" /tmp/analysis.json
          get_live "$LIVE/system" /tmp/system.html /tmp/system.headers
          EXPECTED_SHA="$EXPECTED_SHA" SHA256="$SHA256" python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('/tmp/manifest.json').read_text());s=json.loads(Path('/tmp/status.json').read_text());p=json.loads(Path('/tmp/restoration.json').read_text());c=json.loads(Path('/tmp/canon.json').read_text());e=json.loads(Path('/tmp/evidence.json').read_text());r=json.loads(Path('/tmp/registry.json').read_text());a=json.loads(Path('/tmp/analysis.json').read_text());h=Path('/tmp/system.html').read_text()
          assert m.get('canonicalGitSha')==os.environ['EXPECTED_SHA'],m
          assert m.get('ok') is True,m
          assert m.get('schema')=='OMEGA_DRIVE_CORPUS_ONE_SYSTEM_R195'
          assert m.get('predecessor')=='r194-dual-plane-evidence-restoration'
          assert m.get('workspacePredecessor')=='r193-full-restoration-workspace'
          corpus=m.get('corpus') or {};assert corpus.get('sha256')==os.environ['SHA256'];assert (corpus.get('integrity') or {}).get('ok') is True
          assert (corpus.get('driveEvidence') or {}).get('primaryLedgerId')=='1tvDDlPxHFTXMPN43-rE1kPKdmJW5uYj6'
          tables={x.get('id'):x for x in corpus.get('tables') or []}
          assert tables['registry']['rows']==100
          assert tables['menus']['rows']>=36 and tables['capabilities']['rows']>=18 and tables['runtimeWiring']['rows']>=16 and tables['acceptanceGates']['rows']>=12 and tables['capacityAddressIndex']['rows']>=144 and tables['implementationSequence']['rows']>=16
          assert corpus.get('dispositions')=={'KEEP':63,'MERGE':26,'DONOR':11}
          assert s.get('ok') is True,s
          assert s.get('corpusReady') is True and s.get('runtimeReady') is True
          assert all(x.get('ok') is True for x in s.get('probes') or []),s
          assert e.get('schema')=='OMEGA_V6_EVIDENCE_PLANE_R194' and e.get('ok') is True,e
          assert p.get('schema')=='OMEGA_RESIDUAL_RESTORATION_PLAN_R195',p
          assert p.get('totalArtifacts')==100,p
          assert p.get('individuallyVerifiedArtifacts')==0,p
          assert p.get('residual',{}).get('unresolved')==100,p
          assert p.get('truth',{}).get('menuReachabilityIsNotArtifactProof') is True,p
          assert p.get('truth',{}).get('donorNeverBecomesAuthorityWithoutAdmission') is True,p
          assert p.get('cohortProof',{}).get('total')==12,p
          assert len(p.get('residual',{}).get('weakestFirst') or [])<=24,p
          assert c.get('schema')=='OMEGA_CUMULATIVE_CAPABILITY_CANON_R195' and c.get('totalCapabilityGroups')==66,c
          assert c.get('postR191OperationalOrganCount')==3,c
          ids={x.get('id') for x in c.get('postR191OperationalOrgans') or []}
          assert {'R194_DUAL_PLANE_EVIDENCE_RESTORATION','R195_DRIVE_CORPUS_ONE_SYSTEM','R195_DEWEY_WATER_CONTINUITY_COMPUTE'} <= ids
          assert c.get('canonicalMutation') is False and c.get('promotionAuthorized') is False
          assert r.get('ok') is True and r.get('total')==100
          assert a.get('ok') is True and a.get('formula')=='S188=CΩ/(Λ+q+0.35Λq+0.05)'
          for marker in ('OMEGA ONE SYSTEM','EXECUTION TRUTH CONSOLE','RECOVERED DRIVE CORPUS','data-r195-one-system="true"','id="omegaR193Rail"','RESIDUAL RESTORATION / WEAKEST-LINK QUEUE'): assert marker in h,marker
          PY
          grep -qi '^x-omega-one-system: r195-drive-corpus-one-system' /tmp/system.headers
      - name: Prove invariant-preserving One-System computation reaches VERIFIED
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
        run: |
          set -euo pipefail
          post_live() {
            local url="$1" data="$2" out="$3"
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 20 "$url" -H 'content-type: application/json' --data "$data" -o "$out"; then return 0; fi
              sleep 2
            done
            return 1
          }
          post_live "$LIVE/api/system/r195/execute" '{"operation":"continuity.transfer","input":{"values":[1,2,3],"transfers":[{"from":2,"to":0,"amount":0.25}]}}' /tmp/compute.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/compute.json').read_text());assert p.get('schema')=='OMEGA_ONE_SYSTEM_EXECUTION_RECEIPT_R195';assert p.get('downstreamOk') is True,p;state=p.get('executionState') or {};assert state.get('returned') is True and state.get('verified') is True,state;assert state.get('progression')[-1]=='VERIFIED';v=p.get('verification') or {};assert v.get('class')=='INVARIANT_CONSERVATION' and float(v.get('residual'))<=1e-12;assert p.get('receiptSha256')
          PY
      - name: Prove deterministic Dewey pair, neutral orientation, solve, ensemble and live Calculus surface
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          get_live() {
            local url="$1" out="$2" headers="${3:-}"
            for attempt in $(seq 1 15); do
              if [ -n "$headers" ]; then
                if curl --fail --silent --show-error --max-time 20 -D "$headers" "$url" -o "$out"; then return 0; fi
              else
                if curl --fail --silent --show-error --max-time 20 "$url" -o "$out"; then return 0; fi
              fi
              sleep 2
            done
            return 1
          }
          post_live() {
            local url="$1" data="$2" out="$3"
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 20 "$url" -H 'content-type: application/json' --data "$data" -o "$out"; then return 0; fi
              sleep 2
            done
            return 1
          }
          get_live "$LIVE/api/compute/dewey/r195/manifest" /tmp/dewey-manifest.json
          post_live "$LIVE/api/compute/dewey/r195/pair" '{"b":37,"c":73}' /tmp/dewey-pair.json
          post_live "$LIVE/api/compute/dewey/r195/solve" '{"mode":"full-overall-canon","steps":512,"state":{"continuity":0.72,"plasticity":0.68,"burden":0.24,"contradiction":0.18,"orientation":0,"scar":0.08,"shell":1728}}' /tmp/dewey-neutral.json
          post_live "$LIVE/api/compute/dewey/r195/solve" '{"mode":"mode-188","steps":512,"state":{"continuity":0.72,"plasticity":0.68,"burden":0.24,"contradiction":0.18,"orientation":1,"scar":0.08,"shell":20736}}' /tmp/dewey-solve.json
          post_live "$LIVE/api/compute/dewey/r195/ensemble" '{"mode":"unified-coherence","steps":256,"ensemble":64,"amplitude":0.03}' /tmp/dewey-ensemble.json
          get_live "$LIVE/?app=Calculus&mode=dewey-calculus" /tmp/dewey.html /tmp/dewey.headers
          python - <<'PY'
          import json, math
          from pathlib import Path
          m=json.loads(Path('/tmp/dewey-manifest.json').read_text());p=json.loads(Path('/tmp/dewey-pair.json').read_text());n=json.loads(Path('/tmp/dewey-neutral.json').read_text());s=json.loads(Path('/tmp/dewey-solve.json').read_text());e=json.loads(Path('/tmp/dewey-ensemble.json').read_text());h=Path('/tmp/dewey.html').read_text()
          assert m.get('release')=='r195-dewey-water-continuity-compute',m
          assert len(m.get('modes') or [])==15,m
          assert m.get('shells')==[12,144,1728,20736,248832],m
          assert (m.get('waterGeometry') or {}).get('physicalClaim') is False,m
          assert float((m.get('noZeroMath') or {}).get('epsilon'))==1e-12,m
          # Semantic guard: 37/73 may exist as input/reference values, while 20,736 remains a valid address shell.
          policy=m.get('referenceKernelPolicy') or {}
          assert policy.get('fixedSymmetryAsymmetryConstants') is False,m
          assert policy.get('fixedSymmetryValue') is None and policy.get('fixedAsymmetryValue') is None,policy
          assert float(p.get('reconstructionError'))<1e-12,p
          out=p.get('output') or {};assert abs(float(out.get('relationalEnergyAfter'))-float(out.get('relationalEnergyBefore')))<1e-10,p
          assert (n.get('initial') or {}).get('orientation')==0,n
          nz=n.get('noZero') or {};assert nz.get('neutralOrientationAllowed') is True and nz.get('neutralOrientationCreatesNoSignedDirectionalDrive') is True,n
          assert s.get('canonicalMutation') is False and s.get('physicalMeasurement') is False,s
          assert math.isfinite(float(s.get('omega',0))) and float(s.get('omega',0))>0,s
          assert 0<=float(s.get('coherence',0))<=1,s
          d=s.get('diagnostics') or {};assert float(d.get('maxPairEnergyError',0))<1e-9,s
          result=e.get('result') or {};idx=float(result.get('inevitabilityIndex',-1));assert 0<=idx<=1,e
          assert result.get('interpretation')=='MODEL_CONVERGENCE_INDEX_NOT_FATE',e
          for marker in ('id="odc195"','/api/compute/dewey/r195/solve','64× STABILITY'): assert marker in h,marker
          PY
          grep -qi '^x-omega-dewey-compute: r195-dewey-compute-surface' /tmp/dewey.headers
      - name: Prove grounded B059 SAI reaches VERIFIED
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
        run: |
          set -euo pipefail
          post_live() {
            local url="$1" data="$2" out="$3"
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 20 "$url" -H 'content-type: application/json' --data "$data" -o "$out"; then return 0; fi
              sleep 2
            done
            return 1
          }
          post_live "$LIVE/api/system/r195/execute" '{"operation":"sai.query","prompt":"State the OMEGA address hierarchy and its physical-dimension truth boundary."}' /tmp/sai.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/sai.json').read_text());assert p.get('schema')=='OMEGA_ONE_SYSTEM_EXECUTION_RECEIPT_R195';assert p.get('downstreamOk') is True,p;state=p.get('executionState') or {};assert state.get('returned') is True and state.get('verified') is True,state;v=p.get('verification') or {};assert v.get('class')=='SOURCE_GROUNDED_RECEIPT';r=p.get('result') or {};assert r.get('grounded') is True,r;assert r.get('receipt_sha256'),r;assert p.get('receiptSha256')
          PY
