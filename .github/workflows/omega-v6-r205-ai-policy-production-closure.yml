name: OMEGA V6 legacy R205 AI-policy production proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-publisher-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve R205 AI-policy proof without production mutation
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const aiRequested = body.useAI === true || (body.useAI !== false && includesAny(intent, KEYWORDS.ai));' canonforge-omega/cloudflare/omega-v6-worker/src/system/missionKernelR200.ts
          test -f canonforge-omega/tests/test_r205_explicit_ai_policy_hotfix.py
          test -f .github/workflows/omega-v6-release-forward-production.yml
          echo 'LEGACY_R205_AI_POLICY_PRODUCTION_PUBLISHER_RETIRED_R213'
          echo 'R205 AI-policy semantics remain inherited. Exact-head production mutation belongs exclusively to release-forward.'
