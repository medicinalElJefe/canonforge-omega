name: OMEGA V6 legacy R198-R200 production proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-publisher-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve legacy proof boundary without production mutation
        shell: bash
        run: |
          set -euo pipefail
          test -f canonforge-omega/cloudflare/omega-v6-worker/wrangler.toml
          test -f .github/workflows/omega-v6-release-forward-production.yml
          grep -F 'main = "src/runtimeEntryR169.ts"' canonforge-omega/cloudflare/omega-v6-worker/wrangler.toml
          echo 'LEGACY_R198_R200_PRODUCTION_PUBLISHER_RETIRED_R213'
          echo 'Historical R198-R200 proofs remain repository evidence. Exact-head production mutation belongs exclusively to release-forward.'
