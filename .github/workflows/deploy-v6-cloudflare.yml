name: OMEGA V6 authority boundary from Genesis
on:
  push:
    branches: [omega-genesis-v1-full]
    paths:
      - 'cloudflare/omega-genesis-worker/**'
      - 'web/**'
      - '.github/workflows/deploy-v6-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: omega-genesis-v6-authority-boundary
  cancel-in-progress: false

jobs:
  verify-v6-authority-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: omega-genesis-v1-full
          fetch-depth: 1
      - name: Prove Genesis cannot deploy or own canonical V6
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('cloudflare/omega-genesis-worker/src/convergence.js').read_text(encoding='utf-8')
          assert 'role:"GENESIS_DISCOVERY_EVOLUTION_AUTHORITY"' in source
          assert 'role:"V6_CANONICAL_OPERATIONAL_RUNTIME"' in source
          assert 'release_authority:"omega-v6-full-convergence"' in source
          assert 'genesis_may_deploy_v6:false' in source
          assert 'operational_release_authority:false' in source
          print('ROLE_SEPARATION_PROVEN')
          PY
      - name: Enforce no V6 deployment from Genesis lineage
        run: |
          echo 'GENESIS_V6_DEPLOYMENT_FORBIDDEN: Genesis may observe and propose, but only omega-v6-full-convergence may deploy the canonical V6 Worker.' | tee -a "$GITHUB_STEP_SUMMARY"
          test ! -e cloudflare/omega-genesis-worker/.allow-v6-deploy
