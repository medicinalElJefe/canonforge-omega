name = "omegav6"
main = "src/capabilityRouter.ts"
compatibility_date = "2026-08-29"
workers_dev = true

[vars]
BUILD_ID = "r87-semantic-edge-settle-proof"
TRUTH_BOUNDARY_ID = "r88-hybrid-heartbeat-truth"
CONVERGENCE_TRANSPORT_ID = "r89-genesis-service-binding"
CAPABILITY_ROUTER_ID = "r91-actionable-capability-router"
# Configure SOVEREIGN_ORIGIN in the deployment environment.
# It must point at the authenticated ingress of the sovereign runtime/bridge.

[[durable_objects.bindings]]
name = "OMEGA_RUNTIME"
class_name = "OmegaRuntime"

[[migrations]]
tag = "r32-enacted-runtime"
new_sqlite_classes = ["OmegaRuntime"]

[[services]]
binding = "GENESIS"
service = "omega-genesis-v1"
