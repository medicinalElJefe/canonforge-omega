name: OMEGA V6 legacy Cloudflare recovery proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-publisher-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current release authority exists
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/omega-v6-release-forward-production.yml
          grep -F 'name: OMEGA V6 release-forward exact-head production' .github/workflows/omega-v6-release-forward-production.yml
          echo 'LEGACY_CLOUDFLARE_PUBLISHER_RETIRED_R213'
          echo 'This workflow is diagnostic only. Production mutation belongs exclusively to omega-v6-release-forward-production.yml.'
