name: OMEGA V6 verify

on:
  push:
    branches: [omega-v6-full-convergence]
  pull_request:
    paths:
      - 'canonforge-omega/**'
      - '.github/workflows/omega-v6-verify.yml'

jobs:
  sovereign-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Compile
        working-directory: canonforge-omega
        run: python -m compileall -q omega_runtime api omega_144d_core omega_fusion_core
      - name: Full runtime tests
        working-directory: canonforge-omega
        run: python -m pytest -q
      - name: Import FastAPI authority
        working-directory: canonforge-omega
        run: python -c "from api.app import app; assert app.title == 'OMEGA V6 Sovereign Runtime'"

  cloudflare-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and typecheck
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck

  promotion-compatibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/omega-v6-full-convergence'
    needs: [sovereign-core, cloudflare-interface]
    runs-on: ubuntu-latest
    outputs:
      compatible: ${{ steps.contract.outputs.compatible }}
      status: ${{ steps.contract.outputs.status }}
    steps:
      - name: Checkout exact verified head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: contract
        name: Preserve observed live Durable Object contract
        working-directory: canonforge-omega
        shell: bash
        run: |
          result="$(python scripts/check_cloudflare_contract.py)"
          echo "$result"
          RESULT="$result" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          value = json.loads(os.environ["RESULT"])
          print("compatible=" + str(bool(value["compatible"])).lower())
          print("status=" + value["status"])
          PY
      - name: Explain promotion hold
        if: steps.contract.outputs.compatible != 'true'
        run: echo "PROMOTION HOLD - candidate does not yet preserve the observed live OmegaRuntime Durable Object export. Canonical Worker is left untouched."

  promote-canonical-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/omega-v6-full-convergence' && needs.promotion-compatibility.outputs.compatible == 'true'
    needs: [sovereign-core, cloudflare-interface, promotion-compatibility]
    runs-on: ubuntu-latest
    concurrency:
      group: omega-v6-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout exact verified head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm install
      - name: Reconfirm interface type safety
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm run typecheck
      - name: Deploy exact verified canonical head
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Record promoted SHA
        run: echo "OMEGA V6 promoted exact verified SHA $GITHUB_SHA"
