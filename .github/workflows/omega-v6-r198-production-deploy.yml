name: OMEGA V6 R198.1 guarded production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - omega-v6-full-convergence
    paths:
      - .github/workflows/omega-v6-r198-production-deploy.yml

concurrency:
  group: omega-v6-production
  cancel-in-progress: false

jobs:
  verify-deploy-prove:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Full Sovereign preservation and R198.1 repair contract
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip pytest
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm install

      - name: Typecheck preserved Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm run typecheck

      - name: Wrangler dry run
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Deploy canonical Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Prove R198 source health truth
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS --max-time 45 'https://omegav6.jeffdeweyeljefe.workers.dev/api/earth/sar/r198/sources' || true)"
            if printf '%s' "$BODY" | grep -q 'r198-real-public-sar-truth-fusion' && printf '%s' "$BODY" | grep -q 'no_invented_coordinates'; then
              printf '%s\n' "$BODY" > r198-live-proof.json
              break
            fi
            sleep 5
          done
          test -s r198-live-proof.json

      - name: Prove full SAR query survives canonical routing
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 'https://omegav6.jeffdeweyeljefe.workers.dev/api/earth/sar/r198/search?days=7&limit=1&providers=sentinel1' > r198-query-proof.json
          python - <<'PY'
          import json
          with open('r198-query-proof.json', encoding='utf-8') as f:
              d=json.load(f)
          q=d['query']
          assert q['days'] == 7, q
          assert q['limit_per_provider'] == 1, q
          assert q['providers'] == ['sentinel1'], q
          assert d['truth_boundary']['inferred'].startswith('WITHHELD')
          assert d['truth_boundary']['forecast'].startswith('WITHHELD')
          print('R198_QUERY_PRESERVED', q)
          PY

      - name: Prove repaired Earth UI replaces intrusive R198 panel
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 'https://omegav6.jeffdeweyeljefe.workers.dev/?app=Earth' > earth-r1981.html
          grep -q 'omegaSarIntegratedR198_1Runtime' earth-r1981.html
          grep -q 'REAL SAR' earth-r1981.html
          if grep -q 'omegaSarTruthR198Runtime' earth-r1981.html; then
            echo 'OLD_INTRUSIVE_R198_PANEL_STILL_PRESENT'
            exit 1
          fi

      - name: Prove R198.1 does not leak into non-Earth workspace
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 'https://omegav6.jeffdeweyeljefe.workers.dev/?app=Hybrid' > hybrid-r1981.html
          if grep -q 'omegaSarIntegratedR198_1Runtime' hybrid-r1981.html; then
            echo 'EARTH_SAR_UI_LEAKED_INTO_HYBRID'
            exit 1
          fi
