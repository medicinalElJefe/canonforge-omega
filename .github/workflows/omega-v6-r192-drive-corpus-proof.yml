name: OMEGA V6 R192 live Drive corpus proof

on:
  workflow_run:
    workflows: ["OMEGA V6 verify"]
    types: [completed]
  workflow_dispatch:

jobs:
  prove-r192-live:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'omega-v6-full-convergence')
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed R192 One-System corpus and execution fabric
        shell: bash
        env:
          V6_URL: https://omegav6.jeffdeweyeljefe.workers.dev
          CORPUS_SHA256: d80267761320c3bf3d219b38b6293fc52a02e09182fa0825853c7202131f2746
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors "$V6_URL/api/system/r192/manifest" -o /tmp/r192-manifest.json || true
            curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors "$V6_URL/api/system/r192/status" -o /tmp/r192-status.json || true
            curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors "$V6_URL/api/canon/r192/manifest" -o /tmp/r192-canon.json || true
            curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors "$V6_URL/api/system/r192/registry?limit=1" -o /tmp/r192-registry.json || true
            curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors "$V6_URL/api/system/r192/analyze?table=registry&limit=1" -o /tmp/r192-analysis.json || true
            curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors "$V6_URL/system" -o /tmp/r192-system.html || true
            if CORPUS_SHA256="$CORPUS_SHA256" python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              manifest=json.loads(Path('/tmp/r192-manifest.json').read_text())
              status=json.loads(Path('/tmp/r192-status.json').read_text())
              canon=json.loads(Path('/tmp/r192-canon.json').read_text())
              registry=json.loads(Path('/tmp/r192-registry.json').read_text())
              analysis=json.loads(Path('/tmp/r192-analysis.json').read_text())
              html=Path('/tmp/r192-system.html').read_text()
          except Exception:
              raise SystemExit(1)
          if manifest.get('ok') is not True: raise SystemExit(1)
          if manifest.get('schema') != 'OMEGA_DRIVE_CORPUS_ONE_SYSTEM_R192': raise SystemExit(1)
          corpus=manifest.get('corpus') or {}
          if corpus.get('sha256') != os.environ['CORPUS_SHA256']: raise SystemExit(1)
          if (corpus.get('integrity') or {}).get('ok') is not True: raise SystemExit(1)
          tables={row.get('id'):row for row in corpus.get('tables') or []}
          if (tables.get('registry') or {}).get('rows') != 100: raise SystemExit(1)
          if (tables.get('menus') or {}).get('rows',0) < 36: raise SystemExit(1)
          if (tables.get('capabilities') or {}).get('rows',0) < 18: raise SystemExit(1)
          if (tables.get('acceptanceGates') or {}).get('rows',0) < 12: raise SystemExit(1)
          if (tables.get('runtimeWiring') or {}).get('rows',0) < 16: raise SystemExit(1)
          if (tables.get('capacityAddressIndex') or {}).get('rows',0) < 144: raise SystemExit(1)
          dispositions=corpus.get('dispositions') or {}
          if dispositions.get('KEEP') != 63 or dispositions.get('MERGE') != 26 or dispositions.get('DONOR') != 11: raise SystemExit(1)
          if status.get('ok') is not True: raise SystemExit(1)
          if status.get('corpusReady') is not True or status.get('runtimeReady') is not True: raise SystemExit(1)
          if status.get('requiredProbePassCount') != status.get('requiredProbeCount'): raise SystemExit(1)
          if canon.get('schema') != 'OMEGA_CUMULATIVE_CAPABILITY_CANON_R192': raise SystemExit(1)
          if canon.get('totalCapabilityGroups') != 64: raise SystemExit(1)
          if canon.get('canonicalMutation') is not False or canon.get('promotionAuthorized') is not False: raise SystemExit(1)
          if registry.get('ok') is not True or registry.get('total') != 100: raise SystemExit(1)
          if analysis.get('ok') is not True or analysis.get('formula') != 'S188=CΩ/(Λ+q+0.35Λq+0.05)': raise SystemExit(1)
          for marker in ('OMEGA ONE SYSTEM','Unified execution console','Recovered Drive corpus','Execute through real specialist route'):
              if marker not in html: raise SystemExit(1)
          PY
            then
              verified=true
              break
            fi
            echo "R192 live edge not settled yet (attempt $attempt/20)."
            sleep 3
          done
          if [ "$verified" != "true" ]; then
            echo "R192 LIVE PROOF FAILED"
            cat /tmp/r192-manifest.json || true
            cat /tmp/r192-status.json || true
            cat /tmp/r192-canon.json || true
            exit 1
          fi
      - name: Prove routed reference computation through R192
        shell: bash
        env:
          V6_URL: https://omegav6.jeffdeweyeljefe.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$V6_URL/api/system/r192/execute" \
            -H 'content-type: application/json' \
            --data '{"operation":"continuity.transfer","input":{"values":[1,2,3],"transfers":[{"from":2,"to":0,"amount":0.25}]}}' \
            -o /tmp/r192-execute.json
          python - <<'PY'
          import json
          from pathlib import Path
          packet=json.loads(Path('/tmp/r192-execute.json').read_text())
          if packet.get('schema') != 'OMEGA_ONE_SYSTEM_EXECUTION_RECEIPT_R192': raise SystemExit(1)
          if packet.get('operation') != 'continuity.transfer': raise SystemExit(1)
          if packet.get('downstreamOk') is not True: raise SystemExit(1)
          if packet.get('canonicalMutation') is not False: raise SystemExit(1)
          result=((packet.get('result') or {}).get('result') or {})
          if abs(float(result.get('invariant_before',-1))-6.0) > 1e-12: raise SystemExit(1)
          if abs(float(result.get('invariant_after',-1))-6.0) > 1e-12: raise SystemExit(1)
          if not packet.get('receiptSha256'): raise SystemExit(1)
          print(json.dumps({'status':'R192_LIVE_DRIVE_CORPUS_AND_EXECUTION_PROVED','receipt':packet.get('receiptSha256')},sort_keys=True))
          PY
