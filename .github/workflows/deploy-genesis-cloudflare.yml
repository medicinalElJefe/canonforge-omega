name: OMEGA Genesis Cloudflare deploy
on:
  push:
    branches: [omega-genesis-v1-full]
    paths:
      - 'cloudflare/omega-genesis-worker/**'
      - 'web/**'
      - '.github/workflows/deploy-genesis-cloudflare.yml'
      - 'release/**'
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Genesis core
        run: |
          python -m pip install -U pip pytest
          python -m pip install -e .
          python -m pytest -q
          python scripts/verify_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: cloudflare/omega-genesis-worker
        run: npm install
      - name: Check Worker syntax
        working-directory: cloudflare/omega-genesis-worker
        run: npm run check
      - name: Deploy Genesis Worker or report credential boundary
        working-directory: cloudflare/omega-genesis-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "BLOCKED_CREDENTIALS: core + Worker checks passed; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository Actions secrets to deploy omega-genesis-v1." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run deploy
