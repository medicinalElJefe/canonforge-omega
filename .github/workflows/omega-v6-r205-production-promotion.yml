name: OMEGA V6 legacy R205 whole-system production proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-publisher-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve R205 whole-system proof without production mutation
        shell: bash
        run: |
          set -euo pipefail
          test -f canonforge-omega/cloudflare/omega-v6-worker/src/system/wholeSystemControlR205.ts
          test -f .github/workflows/omega-v6-release-forward-production.yml
          grep -F 'WHOLE_SYSTEM_R205_ID = "r205-whole-system-professional-control"' canonforge-omega/cloudflare/omega-v6-worker/wrangler.toml
          echo 'LEGACY_R205_PRODUCTION_PUBLISHER_RETIRED_R213'
          echo 'R205 whole-system proof remains inherited. Exact-head production mutation belongs exclusively to release-forward.'
