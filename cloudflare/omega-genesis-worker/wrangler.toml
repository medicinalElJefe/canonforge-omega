name = "omega-genesis-v1"
main = "src/index.js"
compatibility_date = "2026-08-30"
workers_dev = true

[[durable_objects.bindings]]
name = "OMEGA_STATE"
class_name = "OmegaGenesisState"

[exports.OmegaGenesisState]
type = "durable-object"
storage = "sqlite"

[assets]
directory = "../../web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/_omega/*" ]

[vars]
BUILD_ID = "omega-genesis-v1"
