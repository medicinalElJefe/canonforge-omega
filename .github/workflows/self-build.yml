name: OMEGA Governed Self-Build

on:
  push:
    branches: [omega-genesis-v1-full]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: omega-genesis-self-build
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  self-build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
      source_sha: ${{ steps.release_head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OMEGA build runtime
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .

      - name: Run governed self-build
        run: python scripts/self_build.py --repair-ledger

      - name: Commit repaired canonical build ledger
        shell: bash
        run: |
          if git diff --quiet -- omega.manifest.json SHA256SUMS.txt; then
            echo "Canonical build ledger already current." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$(git diff --name-only -- . ':!omega.manifest.json' ':!SHA256SUMS.txt' ':!release/**')" ]; then
            echo "QUARANTINE: self-builder detected an attempted write outside its ledger allowlist." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git config user.name "OMEGA Self-Builder"
          git config user.email "omega-self-builder@users.noreply.github.com"
          git add omega.manifest.json SHA256SUMS.txt
          git commit -m "OMEGA self-build: repair canonical release ledger [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Record exact release-source head
        id: release_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload verified self-build
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-self-build-${{ github.sha }}
          path: |
            release/OMEGA_Genesis_v1_1_0_Full_Repository.zip
            release/OMEGA_Genesis_v1_1_0_Full_Repository.zip.sha256
            release/self-build-report.json
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable canonical cloud image
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}/omega-cloud
        run: |
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          TAG="$IMAGE:sha-$GITHUB_SHA"
          docker tag "omega-cloud:selfbuild-${GITHUB_SHA::12}" "$TAG"
          docker push "$TAG"
          docker pull "$TAG"
          DIGEST_REF="$(docker image inspect "$TAG" --format '{{index .RepoDigests 0}}')"
          if ! [[ "$DIGEST_REF" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "QUARANTINE: published image did not resolve to an immutable digest" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "image=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          docker tag "omega-cloud:selfbuild-${GITHUB_SHA::12}" "$IMAGE:genesis-latest"
          docker push "$IMAGE:genesis-latest"
          {
            echo "### Published cloud image"
            echo
            echo "$TAG"
            echo
            echo "$DIGEST_REF"
            echo
            echo "$IMAGE:genesis-latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish governed cloud promotion ledger
        env:
          DIGEST_REF: ${{ steps.publish.outputs.image }}
          RELEASE_SOURCE_SHA: ${{ steps.release_head.outputs.sha }}
        shell: bash
        run: |
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          if [ "$REMOTE_HEAD" != "$LOCAL_HEAD" ]; then
            echo "QUARANTINE: branch advanced during image publication; refusing stale promotion ledger." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("release/self-build-report.json").read_text(encoding="utf-8"))
          payload = {
              "schema": "omega.cloud.promotion.v1",
              "decision": "PROMOTE",
              "image": os.environ["DIGEST_REF"],
              "source_sha": os.environ["RELEASE_SOURCE_SHA"],
              "trigger_sha": os.environ["GITHUB_SHA"],
              "manifest_sha256": report["manifest_sha256"],
              "release_sha256": report["release_sha256"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "provenance": "Drive-derived contracts validated; private Drive identifiers/content excluded",
              "boundary": "This ledger identifies a verified immutable build candidate. It is not proof that a production host deployed it.",
          }
          Path("cloud/omega-cloud/promotion.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          if [ -n "$(git diff --name-only -- . ':!cloud/omega-cloud/promotion.json' ':!release/**')" ]; then
            echo "QUARANTINE: unexpected worktree mutation before promotion-ledger commit." | tee -a "$GITHUB_STEP_SUMMARY"
            git diff --name-only
            exit 1
          fi
          if git diff --quiet -- cloud/omega-cloud/promotion.json; then
            echo "Governed promotion ledger already matches published image." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "OMEGA Self-Builder"
            git config user.email "omega-self-builder@users.noreply.github.com"
            git add cloud/omega-cloud/promotion.json
            git commit -m "OMEGA self-build: publish governed cloud promotion [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          {
            echo "### Governed promotion ledger"
            echo
            echo "Image: $DIGEST_REF"
            echo "Release-source head: $RELEASE_SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: self-build
    if: ${{ vars.OMEGA_AUTODEPLOY_ENABLED == '1' }}
    runs-on: [self-hosted, linux, omega-cloud]
    environment: omega-cloud-production
    concurrency:
      group: omega-cloud-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.self-build.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deployment source before mutation
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pytest -q
          python scripts/verify_release.py
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy immutable image with proof/replay rollback gate
        env:
          OMEGA_GATEWAY_TOKEN: ${{ secrets.OMEGA_GATEWAY_TOKEN }}
          OMEGA_DEPLOY_HEALTH_URL: ${{ vars.OMEGA_DEPLOY_HEALTH_URL }}
          OMEGA_DEPLOY_STATE_DIR: ${{ vars.OMEGA_DEPLOY_STATE_DIR }}
        run: python scripts/cloud_deploy.py --image '${{ needs.self-build.outputs.image }}'

  deployment-boundary:
    needs: self-build
    if: ${{ vars.OMEGA_AUTODEPLOY_ENABLED != '1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record exact deployment boundary
        env:
          IMAGE: ${{ needs.self-build.outputs.image }}
          SOURCE_SHA: ${{ needs.self-build.outputs.source_sha }}
        run: |
          {
            echo "## OMEGA production deployment boundary"
            echo
            echo "Verified immutable image: $IMAGE"
            echo "Verified release-source head: $SOURCE_SHA"
            echo
            echo "Autonomous production deployment is disabled."
            echo "Enable OMEGA_AUTODEPLOY_ENABLED=1 only after an authorized self-hosted runner labeled omega-cloud is installed on the canonical cloud host."
            echo "No production deployment is claimed by this run."
          } >> "$GITHUB_STEP_SUMMARY"
