name = "omega-genesis-v1"
main = "src/convergence_r192.js"
compatibility_date = "2026-08-30"
workers_dev = true

[[durable_objects.bindings]]
name = "OMEGA_STATE"
class_name = "OmegaGenesisState"

[exports.OmegaGenesisState]
type = "durable-object"
storage = "sqlite"

[[services]]
binding = "OMEGA_V6"
service = "omegav6"

[[services]]
binding = "OMEGA_OPTICAL"
service = "omega-optical-machine-r1532"

[assets]
directory = "../../web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/_omega/*" ]

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
BUILD_ID = "omega-genesis-v1-convergence-g2"
GENESIS_SURFACE_FABRIC_R191_ID = "r191-genesis-surface-observer"
GENESIS_RUNTIME_CONTRACT = "R192_SERVICE_BOUND_R1532_ATTESTED"
OMEGA_V6_SERVICE_IDENTITY = "omegav6"
OPTICAL_MACHINE_GENERATION = "R153.2"
