name: OMEGA V6 R193 full restoration proof

on:
  pull_request:
    branches: [omega-v6-full-convergence]
    paths:
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/universalWorkspaceR193.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/workspaceManifestR193.ts'
      - 'canonforge-omega/tests/test_r193_full_restoration_workspace.py'
      - 'canonforge-omega/tests/test_r206_live_proof_coherence.py'
      - '.github/workflows/omega-v6-r193-full-restoration-proof.yml'
  push:
    branches: [omega-v6-full-convergence]
    paths:
      - 'canonforge-omega/**'
      - '.github/workflows/omega-v6-r193-full-restoration-proof.yml'
      - 'canonforge-omega/tests/test_r206_live_proof_coherence.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-r193-live-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-r193:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sovereign test dependencies
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Verify R193 restoration plus cumulative predecessor stack
        working-directory: canonforge-omega
        run: |
          python -m pytest -q \
            tests/test_r193_full_restoration_workspace.py \
            tests/test_r206_live_proof_coherence.py \
            tests/test_r192_navigation_home_repair.py \
            tests/test_r191_universal_surface_fabric.py \
            tests/test_r190_whole_system_acceptance.py \
            tests/test_r189_whole_instrument_convergence.py \
            tests/test_r188_motion_time.py \
            tests/test_r185_172_cloud_federation.py \
            tests/test_r181_live_ai_sai_sovereign_acceptance.py \
            tests/test_r175_independent_solver_validation.py \
            tests/test_r167_authoritative_state_accuracy.py \
            tests/test_r163_interactive_living_field.py \
            tests/test_r153_mobile_workspace_orchestration.py \
            tests/test_r145_governed_mode_atlas.py \
            tests/test_role_separated_convergence_r128.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and typecheck complete Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck
      - name: Prove Worker package dry-run
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npx wrangler deploy --dry-run --outdir .r193-dry-run

  prove-live-r193:
    needs: verify-r193
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof source with canonical history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve currently deployed canonical authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            expected_sha="$(git rev-parse FETCH_HEAD)"
            basis="CURRENT_PR_BASE_CANONICAL_HEAD"
          else
            expected_sha="$GITHUB_SHA"
            basis="CANONICAL_PUSH_HEAD"
          fi
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "basis=$basis" >> "$GITHUB_OUTPUT"
          echo "R193 live proof expects $basis at $expected_sha"

      - name: Wait for two consecutive coherent R193 workspace snapshots
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_SHA: ${{ steps.authority.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          stable=0
          for attempt in $(seq 1 90); do
            proof="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            rm -f /tmp/r193-r191.json /tmp/r193-manifest.json /tmp/r193-health.json /tmp/r193-root.headers /tmp/r193-root.html
            if curl --fail --silent --show-error --max-time 20 \
                "$LIVE/api/fabric/r191/manifest?edgeProof=$proof" -o /tmp/r193-r191.json \
              && curl --fail --silent --show-error --max-time 20 \
                "$LIVE/api/workspace/r193/manifest?edgeProof=$proof" -o /tmp/r193-manifest.json \
              && curl --fail --silent --show-error --max-time 20 \
                "$LIVE/api/workspace/r193/health?edgeProof=$proof" -o /tmp/r193-health.json \
              && curl --fail --silent --show-error --max-time 20 -D /tmp/r193-root.headers \
                "$LIVE/?edgeProof=$proof" -o /tmp/r193-root.html \
              && EXPECTED_SHA="$EXPECTED_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          r191=json.loads(Path('/tmp/r193-r191.json').read_text())
          manifest=json.loads(Path('/tmp/r193-manifest.json').read_text())
          health=json.loads(Path('/tmp/r193-health.json').read_text())
          headers=Path('/tmp/r193-root.headers').read_text(errors='replace').lower()
          html=Path('/tmp/r193-root.html').read_text(errors='replace')
          assert r191.get('canonicalGitSha') == os.environ['EXPECTED_SHA'], r191
          assert manifest.get('ok') is True, manifest
          assert manifest.get('release') == 'r193-full-restoration-workspace', manifest
          assert len(manifest.get('workspaces') or []) == 8, manifest
          assert len(manifest.get('systems') or []) == 19, manifest
          assert len(manifest.get('governed_modes') or []) == 15, manifest
          assert manifest.get('interactive_shells') == [144,1728,20736], manifest
          p=manifest.get('performance_policy') or {}
          assert p.get('duplicate_runtime_authority') is False, p
          assert p.get('duplicate_state_authority') is False, p
          assert health == {'ok': True, 'release': 'r193-full-restoration-workspace', 'schema': 'OMEGA_V6_R193_FULL_RESTORATION_V1', 'workspaces': 8, 'systems': 19, 'modes': 15, 'interactive_shells': [144,1728,20736]}, health
          assert 'content-type: text/html' in headers, headers
          assert 'x-omega-navigation: r192-navigation-home-repair' in headers, headers
          assert 'x-omega-workspace: r193-full-restoration-workspace' in headers, headers
          assert 'id="omegaUniversalNavR192"' in html, html[:1500]
          assert 'id="omegaR193Rail"' in html, html[:1500]
          assert 'Living Operator Field' in html, html[:1500]
          assert 'id="omegaLaunch" class="hidden"' in html, html[:1500]
          PY
            then
              stable=$((stable + 1))
              echo "R193 coherent workspace snapshot observed ($stable/2) on attempt $attempt."
              if [ "$stable" -ge 2 ]; then
                echo "R193_EDGE_COHERENCE_SETTLED $EXPECTED_SHA"
                break
              fi
            else
              stable=0
              echo "R193 edge not coherent yet (attempt $attempt/90)."
            fi
            if [ "$attempt" -eq 90 ]; then
              echo 'R193_EDGE_COHERENCE_PROOF_FAILED'
              for f in /tmp/r193-r191.json /tmp/r193-manifest.json /tmp/r193-health.json /tmp/r193-root.headers /tmp/r193-root.html; do
                echo "--- $f"; cat "$f" 2>/dev/null || true
              done
              exit 1
            fi
            sleep 2
          done

      - name: Verify restored workspace matrix with bounded per-route settle
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_SHA: ${{ steps.authority.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "/"
            "/?app=Calculus&mode=dewey-calculus"
            "/?app=Memory"
            "/?app=Simulate"
            "/?app=Earth"
            "/?app=Assistant"
            "/?app=Hybrid"
            "/?app=Proof"
            "/workbench"
            "/relations"
            "/memory"
            "/calibration"
            "/capabilities"
            "/core"
            "/sai"
            "/compute"
            "/validate"
            "/validate/cross-runtime"
            "/validate/independent"
            "/clouds"
            "/warp"
            "/warp/build"
            "/federation"
            "/evolution"
            "/truth"
            "/convergence"
            "/fabric"
            "/instrument"
          )
          i=0
          for route in "${routes[@]}"; do
            i=$((i+1))
            ok=false
            for attempt in $(seq 1 20); do
              proof="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-route-${i}-${attempt}"
              if [[ "$route" == *\?* ]]; then target="$LIVE$route&edgeProof=$proof"; else target="$LIVE$route?edgeProof=$proof"; fi
              rm -f "/tmp/r193-$i.headers" "/tmp/r193-$i.html"
              if curl --fail --silent --show-error --max-time 25 -D "/tmp/r193-$i.headers" "$target" -o "/tmp/r193-$i.html" \
                && grep -qi '^content-type: text/html' "/tmp/r193-$i.headers" \
                && grep -qi '^x-omega-navigation: r192-navigation-home-repair' "/tmp/r193-$i.headers" \
                && grep -qi '^x-omega-workspace: r193-full-restoration-workspace' "/tmp/r193-$i.headers" \
                && grep -Fq 'id="omegaUniversalNavR192"' "/tmp/r193-$i.html" \
                && grep -Fq 'id="omegaR193Rail"' "/tmp/r193-$i.html"; then
                ok=true
                break
              fi
              sleep 2
            done
            if [ "$ok" != true ]; then
              echo "R193_ROUTE_NOT_COHERENT $route"
              exit 1
            fi
          done

          grep -F 'Living Operator Field' /tmp/r193-1.html
          grep -F 'id="omegaLaunch" class="hidden"' /tmp/r193-1.html
          grep -F 'data-gma-mode' /tmp/r193-1.html
          grep -F 'applyMode(id)' /tmp/r193-1.html
          grep -F 'applyShell(value)' /tmp/r193-1.html

          # Reconfirm API responses remain JSON and are never workspace-wrapped.
          proof="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-api-final"
          curl --fail --silent --show-error --max-time 20 -D /tmp/r193-manifest-final.headers \
            "$LIVE/api/workspace/r193/manifest?edgeProof=$proof" -o /tmp/r193-manifest-final.json
          grep -qi '^content-type: application/json' /tmp/r193-manifest-final.headers
          if grep -qi '^x-omega-workspace:' /tmp/r193-manifest-final.headers; then
            echo 'R193 must not HTML-wrap JSON/API responses'
            exit 1
          fi
          echo "R193_FULL_RESTORATION_LIVE_VERIFIED $EXPECTED_SHA"

      - name: Publish R193 coherent live proof summary
        if: always()
        env:
          EXPECTED_SHA: ${{ steps.authority.outputs.expected_sha }}
          BASIS: ${{ steps.authority.outputs.basis }}
        shell: bash
        run: |
          {
            echo '## OMEGA R193 coherent restoration proof'
            echo
            echo "- Authority basis: \`$BASIS\`"
            echo "- Expected deployed SHA: \`$EXPECTED_SHA\`"
            echo '- R191 identity + R193 manifest/health + root workspace projection: 2 consecutive snapshots required'
            echo '- 28 restored workspace/system routes: individually settled and header/DOM-proven'
            echo '- JSON/API wrapping boundary: preserved'
          } >> "$GITHUB_STEP_SUMMARY"
