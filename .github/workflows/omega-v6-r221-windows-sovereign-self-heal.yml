name: OMEGA V6 R221 Windows sovereign self-heal proof

on:
  pull_request:
    branches: [omega-v6-full-convergence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-r221-self-heal-proof:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        working-directory: canonforge-omega
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'

      - name: Prove R221 source and inherited sovereign boundaries
        working-directory: canonforge-omega
        shell: pwsh
        run: |
          python -m pytest -q tests/test_r221_windows_sovereign_self_heal.py tests/test_r208_physical_sovereign_acceptance.py tests/test_r209_sovereign_convergence_diagnostics.py tests/test_r210_sovereign_proof_archive.py tests/test_r211_sovereign_proof_index.py

      - name: Parse R221 with Windows PowerShell 5.1
        working-directory: canonforge-omega
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts\REPAIR_AND_PROVE_OMEGA_V6_WINDOWS_R221.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
          }

      - name: Execute non-mutating R221 report-only behavior
        working-directory: canonforge-omega
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\REPAIR_AND_PROVE_OMEGA_V6_WINDOWS_R221.ps1 -ReportOnly -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "R221 report-only exited $LASTEXITCODE" }
          $receipt = Get-Content -Raw logs\r221_sovereign_repair_latest.json | ConvertFrom-Json
          if ($receipt.schema -ne 'OMEGA_WINDOWS_SOVEREIGN_SELF_HEAL_R221') { throw 'Unexpected R221 receipt schema' }
          if ($receipt.revision -ne 'R221') { throw 'Unexpected R221 receipt revision' }
          if (-not [bool]$receipt.reportOnly) { throw 'Report-only receipt did not preserve reportOnly=true' }
          if ($receipt.state -ne 'REPORT_ONLY_NO_REPAIR_ATTEMPTED') { throw "Unexpected report-only state: $($receipt.state)" }
          if ([bool]$receipt.canonicalMutation) { throw 'R221 report-only may not mutate Canon' }
          if ([bool]$receipt.promotionAuthorized) { throw 'R221 report-only may not authorize promotion' }
          if (-not [bool]$receipt.boundaries.foreignPortOwnerIsNeverKilled) { throw 'Foreign-port safety boundary missing' }
          if (-not [bool]$receipt.boundaries.pairingCredentialsAreNeverWrittenToThisReceipt) { throw 'Credential-retention boundary missing' }
          $raw = Get-Content -Raw logs\r221_sovereign_repair_latest.json
          if ($raw -match 'OMEGA_TOKEN\s*=') { throw 'Credential material leaked into R221 receipt' }
