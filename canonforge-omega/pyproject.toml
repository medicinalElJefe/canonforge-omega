[project]
name = "canonforge-omega"
version = "6.0.0"
description = "OMEGA V6 sovereign convergence runtime: Mode 188, Dewey operators, 144/1728/20736 atlas, proof ledger, motion relativity, forecast boundaries, and desktop/public interfaces."
requires-python = ">=3.10"
authors = [{name = "Jeffrey Alan Dewey"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
canonforge-omega = "omega_runtime.cli:main"
omega-v6 = "omega_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "omega_runtime*", "omega_144d_core*", "omega_fusion_core*"]
exclude = ["web*", "cloudflare*", "desktop_ui*", "tests*", "examples*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
