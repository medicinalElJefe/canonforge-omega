name = "omegav6"
main = "src/heartbeatTruth.ts"
compatibility_date = "2026-08-29"
workers_dev = true

[vars]
BUILD_ID = "r87-semantic-edge-settle-proof"
TRUTH_BOUNDARY_ID = "r88-hybrid-heartbeat-truth"
CONVERGENCE_TRANSPORT_ID = "r89-genesis-service-binding"
CAPABILITY_ROUTER_ID = "r91-actionable-capability-router"
RELATION_WORKBENCH_ID = "r94-relation-workbench-graph-projection"
RICH_OPERATIONAL_UI_ID = "r126-rich-operational-expansion"
# Configure SOVEREIGN_ORIGIN in the deployment environment.
# It must point at the authenticated ingress of the sovereign runtime/bridge.

[[durable_objects.bindings]]
name = "OMEGA_RUNTIME"
class_name = "OmegaRuntime"

# Declarative Durable Object lifecycle. OmegaRuntime already exists as a
# SQLite-backed namespace; this preserves that namespace without replaying
# a stale legacy migration tag against live Durable Objects.
[exports.OmegaRuntime]
type = "durable-object"
storage = "sqlite"

[[services]]
binding = "GENESIS"
service = "omega-genesis-v1"
