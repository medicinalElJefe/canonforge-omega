name: OMEGA V6 visual delivery proof

# Historical preservation tokens only — never required in current root HTML:
# r143-ultra-quality-view
# omegaIndividualSkinRelativity
# omegaUltraQualityView
# orsfUltraQuality
# root+micro-macro-skin+ultra-quality+phase+integrity-v3
# PUBLIC_VISUAL_DELIVERY_VERIFIED
# /?view=Field&delivery_probe=$GITHUB_SHA
# r149-intelligence-reasoning-pipeline
# ?view=Intelligence
# INSPECT ROUTE
# GENERATE FROM ADMITTED ROUTE
# PUBLIC_INTELLIGENCE_REASONING_VERIFIED
# r150-create-simulate-branch-lab
# ?view=Create&delivery_probe=$GITHUB_SHA
# ROLLBACK / DISCARD
# PUBLIC_CREATE_SIMULATE_VERIFIED
# r151-sovereign-devices-compute
# omegaSovereignDevicesRuntime
# SOVEREIGN DEVICES / COMPUTE
# BROWSER CREDENTIAL
# AGENT REACHABILITY
# AUTHENTICATING
# PC ONLINE
# ERROR / STALE
# /api/convergence/edge
# PUBLIC_SOVEREIGN_DEVICES_VERIFIED
# r152-earth-truth-layers
# omegaEarthTruthLayersRuntime
# EARTH TRUTH LENS
# OBSERVED_SOURCE
# DERIVED_FRAMEWORK_MATH
# FORECAST_PROJECTION
# /api/earth/catalog
# PUBLIC_EARTH_TRUTH_LAYERS_VERIFIED

on:
  push:
    branches: [omega-v6-full-convergence]
  workflow_dispatch:

jobs:
  prove-public-visual:
    runs-on: ubuntu-latest
    concurrency:
      group: omega-v6-visual-proof
      cancel-in-progress: true
    steps:
      - name: Verify public Build Evolution governance and preserved runtime
        shell: bash
        env:
          V6_URL: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_VISUAL_RELEASE: r154-build-evolution-governance
          EXPECTED_FIELD_RELEASE: r163-immersive-living-field
          EXPECTED_FIELD_LAYER_RELEASE: r165-non-destructive-layer-deck
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --retry 2 --retry-delay 1 --retry-all-errors -D /tmp/v6-root.headers "$V6_URL/?view=Build&delivery_probe=$GITHUB_SHA" -o /tmp/v6-root.html || true
            if EXPECTED_VISUAL_RELEASE="$EXPECTED_VISUAL_RELEASE" EXPECTED_FIELD_RELEASE="$EXPECTED_FIELD_RELEASE" EXPECTED_FIELD_LAYER_RELEASE="$EXPECTED_FIELD_LAYER_RELEASE" python - <<'PY'
          import os
          from pathlib import Path
          html = Path('/tmp/v6-root.html').read_text(errors='ignore') if Path('/tmp/v6-root.html').exists() else ''
          headers = Path('/tmp/v6-root.headers').read_text(errors='ignore').lower() if Path('/tmp/v6-root.headers').exists() else ''
          release = os.environ['EXPECTED_VISUAL_RELEASE']
          field_release = os.environ['EXPECTED_FIELD_RELEASE']
          field_layer_release = os.environ['EXPECTED_FIELD_LAYER_RELEASE']
          required = [
              f'content="{release}"',
              f'content="{field_release}"',
              f'content="{field_layer_release}"',
              'omegaRootSovereignField',
              'gmaLayerToggle',
              'omega-field-layer',
              'omegaFieldLayers',
              'omegaGovernedModeAtlasRuntime',
              'omegaUnifiedMotionRelativityRuntime',
              'omegaInteractiveFieldRelease',
              'omegaFieldFrame',
              'omega-field-reset',
              'DRAG TO EXPLORE',
              'omegaMemoryContinuityRuntime',
              'omegaIntelligenceReasoningRuntime',
              'omegaCreateSimulateRuntime',
              'omegaSovereignDevicesRuntime',
              'omegaEarthTruthLayersRuntime',
              'omegaBuildEvolutionGovernanceRuntime',
              'Build / Evolution',
              'Canonical candidate lifecycle',
              'EXACT-HEAD CI',
              'PROMOTE / REJECT',
              'DEPLOY VERIFY',
              '/api/convergence/edge',
              '/api/development/status',
              'SECONDARY WORKSPACE',
              'No promote, deploy, merge or rollback mutation action is exposed here',
              'OBSERVED_SOURCE',
              'DERIVED_FRAMEWORK_MATH',
              'FORECAST_PROJECTION',
              'SIMULATED_CONTINUATION',
              'finite_difference + RK2 integral curves',
              '20,736',
              'route-before-generation',
              'omegaVisualRuntimeIntegrity',
              '61,917,364,224',
          ]
          forbidden = ['omegaIndividualSkinRelativity','omegaUltraQualityView','orsfUltraQuality','omegaMicroMacroGeometry','omegaSymmetryBalance']
          if not all(item in html for item in required): raise SystemExit(1)
          if any(item in html for item in forbidden): raise SystemExit(1)
          if f'x-omega-visual-release: {release}' not in headers: raise SystemExit(1)
          if f'x-omega-field-release: {field_release}' not in headers: raise SystemExit(1)
          if f'x-omega-field-layer-release: {field_layer_release}' not in headers: raise SystemExit(1)
          contract='single-surface+recovered-experience-orchestration+native-20736-atlas+calculus-field+rk2-flow+memory-continuity+intelligence-route-mode-forecast-action-gate+create-simulate-branch-comparison+sovereign-device-heartbeat-truth+earth-observed-derived-forecast-truth+build-evolution-governance+rollback+runtime-truth+integrity-v6'
          field_contract='single-renderer+drag-pan+wheel-pinch-zoom+probe+pause-reset+progressive-controls+live-frame-integrity+independent-layer-deck'
          if f'x-omega-visual-contract: {contract}' not in headers: raise SystemExit(1)
          if f'x-omega-field-contract: {field_contract}' not in headers: raise SystemExit(1)
          if 'cache-control: no-store, no-cache, must-revalidate' not in headers: raise SystemExit(1)
          PY
            then
              ok=true
              echo "PUBLIC_BUILD_EVOLUTION_AND_FIELD_VERIFIED visual=$EXPECTED_VISUAL_RELEASE field=$EXPECTED_FIELD_RELEASE layers=$EXPECTED_FIELD_LAYER_RELEASE sha=$GITHUB_SHA"
              break
            fi
            echo "Visual edge not settled on $EXPECTED_VISUAL_RELEASE yet ($attempt/60)."
            sleep 2
          done
          if [ "$ok" != "true" ]; then
            echo "PUBLIC_BUILD_EVOLUTION_FAILED"
            exit 1
          fi
