name = "omegav6"
main = "src/runtimeEntryR169.ts"
# Protected canonical implementation remains main = "src/heartbeatTruth.ts" semantically;
# runtimeEntryR169 delegates every non-swarm request directly to heartbeatTruth.
compatibility_date = "2026-08-29"
workers_dev = true

[vars]
BUILD_ID = "r87-semantic-edge-settle-proof"
TRUTH_BOUNDARY_ID = "r88-hybrid-heartbeat-truth"
CONVERGENCE_TRANSPORT_ID = "r89-genesis-service-binding"
CAPABILITY_ROUTER_ID = "r91-actionable-capability-router"
RELATION_WORKBENCH_ID = "r94-relation-workbench-graph-projection"
RICH_OPERATIONAL_UI_ID = "r126-rich-operational-expansion"
SWARM_NAMESPACE_RECOVERY_ID = "r169-public-r121-r123-r125-lineage"
SWARM_PRECISION_BODY_ID = "r170-live-plan-mission-instrument"
SWARM_MODEL_ID = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "OMEGA_RUNTIME"
class_name = "OmegaRuntime"

[[durable_objects.bindings]]
name = "OMEGA_SWARM_CELL"
class_name = "OmegaSwarmCell"

[[durable_objects.bindings]]
name = "OMEGA_SWARM_COORDINATOR"
class_name = "OmegaSwarmCoordinator"

[[durable_objects.bindings]]
name = "OMEGA_SWARM_BRANCH"
class_name = "OmegaSwarmBranch"

[[durable_objects.bindings]]
name = "OMEGA_SWARM_ORGAN"
class_name = "OmegaSwarmOrgan"

[[durable_objects.bindings]]
name = "OMEGA_SWARM_ORGANISM"
class_name = "OmegaSwarmOrganismCoordinator"

[[durable_objects.bindings]]
name = "OMEGA_SWARM_AUTONOMIC"
class_name = "OmegaSwarmAutonomicCoordinator"

# These namespaces already exist in production. Declarative exports preserve
# them without replaying historical class-creation migrations or deleting state.
[exports.OmegaRuntime]
type = "durable-object"
storage = "sqlite"

[exports.OmegaSwarmCell]
type = "durable-object"
storage = "sqlite"

[exports.OmegaSwarmCoordinator]
type = "durable-object"
storage = "sqlite"

[exports.OmegaSwarmBranch]
type = "durable-object"
storage = "sqlite"

[exports.OmegaSwarmOrgan]
type = "durable-object"
storage = "sqlite"

[exports.OmegaSwarmOrganismCoordinator]
type = "durable-object"
storage = "sqlite"

[exports.OmegaSwarmAutonomicCoordinator]
type = "durable-object"
storage = "sqlite"

[[services]]
binding = "GENESIS"
service = "omega-genesis-v1"
