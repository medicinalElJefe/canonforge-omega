name: OMEGA V6 legacy R204 production proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-publisher-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve R204 verified-return authority without production mutation
        shell: bash
        run: |
          set -euo pipefail
          test -f canonforge-omega/cloudflare/omega-v6-worker/src/system/hybridMissionRouteR203.ts
          test -f .github/workflows/omega-v6-r204-live-proof.yml
          test -f .github/workflows/omega-v6-release-forward-production.yml
          echo 'LEGACY_R204_PRODUCTION_PUBLISHER_RETIRED_R213'
          echo 'R204 verified-return proof remains inherited. Exact-head production mutation belongs exclusively to release-forward.'
