name: OMEGA V6 manual Cloudflare recovery deploy

on:
  workflow_dispatch:

concurrency:
  group: omega-v6-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sovereign core and R189 preservation
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip pytest
          python -m pytest -q tests/test_omega_runtime.py tests/test_r189_whole_instrument_convergence.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm install
      - name: Typecheck Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm run typecheck
      - name: Deploy Worker manually
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy