name: OMEGA V6 R220 downloadable Hybrid setup proof

on:
  pull_request:
    branches: [omega-v6-full-convergence]
    paths:
      - 'canonforge-omega/scripts/START_OMEGA_R220_FULL_HYBRID.cmd'
      - 'canonforge-omega/scripts/START_OMEGA_SOVEREIGN.cmd'
      - 'canonforge-omega/scripts/START_OMEGA_SOVEREIGN.ps1'
      - 'canonforge-omega/scripts/START_OMEGA_R222_FULL_HYBRID.cmd'
      - 'canonforge-omega/scripts/START_OMEGA_R222_FULL_HYBRID.ps1'
      - 'canonforge-omega/scripts/omega_sovereign_agent.py'
      - 'canonforge-omega/config/repair_system_contract.json'
      - 'canonforge-omega/api/**'
      - 'canonforge-omega/omega_runtime/**'
      - 'canonforge-omega/tests/test_r206_sovereign_windows_boot_continuity.py'
      - 'canonforge-omega/tests/test_r207_windows_verified_venv_launch.py'
      - 'canonforge-omega/tests/test_r222_hybrid_bootstrap_single_instance.py'
      - 'canonforge-omega/tests/test_repair_system_contract.py'
      - '.github/workflows/omega-v6-r220-downloadable-hybrid-setup-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-r220-downloadable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-through-canonical-gateway-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: canonforge-omega

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4

      - name: Set up supported Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: canonforge-omega/pyproject.toml

      - name: Establish verified dependency environment and native RCWA
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .venv
          $py = (Resolve-Path '.\.venv\Scripts\python.exe').Path
          & $py -m pip install --upgrade pip
          & $py -m pip install -e '.[dev,rcwa]'
          if ($LASTEXITCODE -ne 0) { throw 'R220 successor dependency establishment failed' }
          $probeRaw = & $py -m omega_runtime.rcwa_solver --probe
          if ($LASTEXITCODE -ne 0) { throw 'R220 successor native RCWA probe process failed' }
          $probe = ($probeRaw -join "`n") | ConvertFrom-Json
          if (-not $probe.available) { throw 'R220 successor native grcwa RCWA unavailable' }
          $probeRaw | Set-Content -Encoding utf8 'r220-compat-rcwa-proof.json'

      - name: Prove R220 compatibility delegates into one stable system owner
        run: |
          $ErrorActionPreference = 'Stop'
          $legacy = Get-Content -Raw 'scripts\START_OMEGA_R220_FULL_HYBRID.cmd'
          $stableCmd = Get-Content -Raw 'scripts\START_OMEGA_SOVEREIGN.cmd'
          $stablePs = Get-Content -Raw 'scripts\START_OMEGA_SOVEREIGN.ps1'
          $releaseCmd = Get-Content -Raw 'scripts\START_OMEGA_R222_FULL_HYBRID.cmd'
          $implementation = Get-Content -Raw 'scripts\START_OMEGA_R222_FULL_HYBRID.ps1'

          if ($legacy -notmatch 'START_OMEGA_SOVEREIGN\.cmd') { throw 'R220 compatibility name does not delegate to stable sovereign gateway' }
          if ($legacy -match 'omega_runtime\.cli|omega_sovereign_agent\.py') { throw 'R220 compatibility wrapper still owns a parallel runtime or agent' }
          if ($stableCmd -notmatch 'START_OMEGA_SOVEREIGN\.ps1') { throw 'Stable CMD gateway does not delegate to stable PowerShell gateway' }
          if ($stablePs -notmatch 'START_OMEGA_R222_FULL_HYBRID\.ps1') { throw 'Stable PowerShell gateway does not resolve the current governed implementation' }
          if ($releaseCmd -notmatch 'START_OMEGA_SOVEREIGN\.cmd') { throw 'Current release CMD bypasses stable sovereign gateway' }
          if ($implementation -notmatch 'OMEGA_R222_FULL_HYBRID_SINGLE_INSTANCE') { throw 'Current implementation lacks single-owner mutex' }
          if ($implementation -notmatch '\$Port = 8127') { throw 'Current implementation does not preserve canonical localhost port 8127' }
          if ($implementation -notmatch 'Stop-OwnedAgents') { throw 'Current implementation lacks stale/duplicate agent reconciliation' }
          if ($implementation -notmatch '/api/hybrid/enrollment') { throw 'Current implementation lacks signed outbound enrollment' }
          if ($implementation -notmatch '/api/hybrid/authority/grant') { throw 'Current implementation lacks bounded local execution authority' }
          if ($implementation -notmatch 'duplicateLauncherStarted = \$false') { throw 'Current implementation does not record no-duplicate ownership proof' }

          $proof = [ordered]@{
            schema = 'OMEGA_R220_COMPATIBILITY_TO_REPAIR_SYSTEM_R222'
            state = 'VERIFIED'
            sourceSha = (git rev-parse HEAD).Trim()
            historicalEntrypoint = 'scripts/START_OMEGA_R220_FULL_HYBRID.cmd'
            stableEntrypoint = 'scripts/START_OMEGA_SOVEREIGN.ps1'
            currentImplementation = 'scripts/START_OMEGA_R222_FULL_HYBRID.ps1'
            canonicalPort = 8127
            nativeRcwaRequired = $true
            parallelOwnerForbidden = $true
            physicalPcClaimed = $false
            canonicalMutation = $false
            deploymentAuthorized = $false
            promotionAuthorized = $false
          }
          $proof | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 'r220-compatibility-system-proof.json'
          Write-Host 'R220_COMPATIBILITY_DELEGATION_TO_STABLE_SINGLE_OWNER_VERIFIED'

      - name: Run successor-aware Windows and repair-system regression gates
        run: |
          $ErrorActionPreference = 'Stop'
          $py = (Resolve-Path '.\.venv\Scripts\python.exe').Path
          & $py -m pytest -q `
            tests\test_r206_sovereign_windows_boot_continuity.py `
            tests\test_r207_windows_verified_venv_launch.py `
            tests\test_r222_hybrid_bootstrap_single_instance.py `
            tests\test_repair_system_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'R220 successor compatibility/system regression suite failed' }

      - name: Record proof boundary
        if: always()
        run: |
          @'
          ## OMEGA R220 downloadable compatibility proof

          R220 is now a historical compatibility entrypoint, not an independent process owner. This Windows gate proves that the old downloadable name delegates through the stable `START_OMEGA_SOVEREIGN` gateway into the current single-owner implementation, while native `grcwa` remains mandatory and the repair-system regressions remain enforced.

          Authenticated host execution/return/next-stage continuity is proved separately by the cumulative post-Hybrid Windows workflow. This compatibility gate does not impersonate or claim the operator's physical PC and grants no Canon, deployment or promotion authority.
          '@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload compatibility proof packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-r220-compatibility-system-proof
          if-no-files-found: warn
          path: |
            canonforge-omega/r220-compatibility-system-proof.json
            canonforge-omega/r220-compat-rcwa-proof.json
