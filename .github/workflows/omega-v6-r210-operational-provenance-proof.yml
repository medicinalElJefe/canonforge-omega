name: OMEGA V6 R210 operational provenance proof

on:
  pull_request:
    branches: [omega-v6-full-convergence]
    paths:
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/system/operationalProvenanceFabricR210.ts'
      - 'canonforge-omega/tests/test_r210_operational_provenance_fabric.py'
      - '.github/workflows/omega-v6-r210-operational-provenance-proof.yml'
  push:
    branches: [omega-v6-full-convergence]
    paths:
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/system/operationalProvenanceFabricR210.ts'
      - 'canonforge-omega/tests/test_r210_operational_provenance_fabric.py'
      - '.github/workflows/omega-v6-r210-operational-provenance-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-r210-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-r210-source-and-cumulative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove R209 ancestry and immutable authority bindings
        shell: bash
        env:
          R209_BASE: 8c1d90d4fdcf52b65a180e140a2ff978dbe85140
        run: |
          set -euo pipefail
          git cat-file -e "$R209_BASE^{commit}"
          git merge-base --is-ancestor "$R209_BASE" HEAD
          grep -F 'main = "src/runtimeEntryR169.ts"' canonforge-omega/cloudflare/omega-v6-worker/wrangler.toml
          git diff --exit-code "$R209_BASE" HEAD -- \
            canonforge-omega/cloudflare/omega-v6-worker/wrangler.toml \
            canonforge-omega/cloudflare/omega-v6-worker/src/heartbeatTruth.ts \
            canonforge-omega/cloudflare/omega-v6-worker/src/convergenceRuntimeAliasR204.ts \
            canonforge-omega/cloudflare/omega-v6-worker/src/system/omegaRuntimeR201.ts \
            canonforge-omega/cloudflare/omega-v6-worker/src/system/hybridMissionLedgerR203.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sovereign test dependencies
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: R210 and cumulative authority regression
        working-directory: canonforge-omega
        run: |
          python -m pytest -q \
            tests/test_r210_operational_provenance_fabric.py \
            tests/test_r208_physical_sovereign_acceptance_closure.py \
            tests/test_r207_windows_sovereign_loopback.py \
            tests/test_r206_sovereign_windows_boot_continuity.py \
            tests/test_r205_whole_system_professional_control.py \
            tests/test_r204_verified_hybrid_return_admission.py \
            tests/test_r201_durable_mission_continuity.py \
            tests/test_r198_earth_sar_truth_fusion.py \
            tests/test_r197_source_grounding_runtime.py \
            tests/test_r195_one_system_drive_corpus.py \
            tests/test_r193_full_restoration_workspace.py \
            tests/test_r190_whole_system_acceptance.py \
            tests/test_r185_172_cloud_federation.py \
            tests/test_r175_independent_solver_validation.py \
            tests/test_role_separated_convergence_r128.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck complete Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck
      - name: Prove complete Worker package without deployment
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npx wrangler deploy --dry-run --outdir .r210-dry-run
      - name: Prove R210 truth boundaries remain non-mutating
        shell: bash
        run: |
          set -euo pipefail
          F=canonforge-omega/cloudflare/omega-v6-worker/src/system/operationalProvenanceFabricR210.ts
          grep -F 'CORRELATED_EVIDENCE_VIEW_NOT_NEW_RUNTIME_AUTHORITY' "$F"
          grep -F 'driveSnapshotIsNotLiveDriveTelemetry: true' "$F"
          grep -F 'publicSarCatalogIsNotRealTimeRadar: true' "$F"
          grep -F 'pcOnlineRequiresCurrentAuthenticatedHeartbeat: true' "$F"
          grep -F 'canonicalMutation: false' "$F"
          grep -F 'hostStateMutation: false' "$F"
          grep -F 'promotionAuthorized: false' "$F"
