name: OMEGA V6 visual delivery proof

on:
  push:
    branches: [omega-v6-full-convergence]
  workflow_dispatch:

jobs:
  prove-public-visual:
    runs-on: ubuntu-latest
    concurrency:
      group: omega-v6-visual-proof
      cancel-in-progress: true
    steps:
      - name: Verify public root HTML carries exact visual release
        shell: bash
        env:
          V6_URL: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_VISUAL_RELEASE: r142-micro-macro-skin-geometry
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --retry 2 --retry-delay 1 --retry-all-errors -D /tmp/v6-root.headers "$V6_URL/?view=Field&delivery_probe=$GITHUB_SHA" -o /tmp/v6-root.html || true
            if EXPECTED_VISUAL_RELEASE="$EXPECTED_VISUAL_RELEASE" python - <<'PY'
          import os
          from pathlib import Path
          html = Path('/tmp/v6-root.html').read_text(errors='ignore') if Path('/tmp/v6-root.html').exists() else ''
          headers = Path('/tmp/v6-root.headers').read_text(errors='ignore').lower() if Path('/tmp/v6-root.headers').exists() else ''
          release = os.environ['EXPECTED_VISUAL_RELEASE']
          required = [
              f'content="{release}"',
              'omegaRootSovereignField',
              'omegaIndividualSkinRelativity',
              'omegaVisualRuntimeIntegrity',
              'omegaMicroMacroGeometry',
              'omegaSymmetryBalance',
              'OMEGA · LIVE SOVEREIGN FIELD',
              '61,917,364,224',
              'MICRO↕MACRO',
              'SYM↔ASYM',
          ]
          if not all(item in html for item in required): raise SystemExit(1)
          if f'x-omega-visual-release: {release}' not in headers: raise SystemExit(1)
          if 'x-omega-visual-contract: root+micro-macro-skin+phase+integrity-v2' not in headers: raise SystemExit(1)
          if 'cache-control: no-store, no-cache, must-revalidate' not in headers: raise SystemExit(1)
          PY
            then
              ok=true
              echo "PUBLIC_VISUAL_DELIVERY_VERIFIED release=$EXPECTED_VISUAL_RELEASE sha=$GITHUB_SHA"
              break
            fi
            echo "Visual edge not settled on $EXPECTED_VISUAL_RELEASE yet ($attempt/60)."
            sleep 2
          done
          if [ "$ok" != "true" ]; then
            echo "PUBLIC_VISUAL_DELIVERY_FAILED"
            echo "Headers:"; cat /tmp/v6-root.headers || true
            echo "Root markers:"; grep -oE 'r14[0-9][^"< ]*|omegaRootSovereignField|omegaIndividualSkinRelativity|omegaVisualRuntimeIntegrity|omegaMicroMacroGeometry|omegaSymmetryBalance' /tmp/v6-root.html | head -60 || true
            exit 1
          fi
