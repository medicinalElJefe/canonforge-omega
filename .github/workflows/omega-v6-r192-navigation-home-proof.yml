name: OMEGA V6 R192 navigation home proof

on:
  pull_request:
    branches: [omega-v6-full-convergence]
    paths:
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/runtimeEntryR169.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/src/universalNavigationR192.ts'
      - 'canonforge-omega/cloudflare/omega-v6-worker/wrangler.toml'
      - 'canonforge-omega/tests/test_r192_navigation_home_repair.py'
      - 'canonforge-omega/tests/test_r208_corpus_coverage.py'
      - 'canonforge-omega/tests/test_r208_r192_edge_coherence.py'
      - '.github/workflows/omega-v6-r192-navigation-home-proof.yml'
  push:
    branches: [omega-v6-full-convergence]
    paths:
      - 'canonforge-omega/**'
      - '.github/workflows/omega-v6-r192-navigation-home-proof.yml'
  workflow_dispatch:

jobs:
  verify-r192:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sovereign test dependencies
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Verify R192 plus cumulative predecessor regression
        working-directory: canonforge-omega
        run: |
          python -m pytest -q \
            tests/test_r192_navigation_home_repair.py \
            tests/test_r208_r192_edge_coherence.py \
            tests/test_r191_universal_surface_fabric.py \
            tests/test_r190_whole_system_acceptance.py \
            tests/test_r189_whole_instrument_convergence.py \
            tests/test_r188_motion_time.py \
            tests/test_role_separated_convergence_r128.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and typecheck complete Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: |
          npm install
          npm run typecheck
      - name: Prove Worker package dry-run
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npx wrangler deploy --dry-run --outdir .r192-dry-run

  prove-live-r192:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/omega-v6-full-convergence')
    needs: verify-r192
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof source with canonical history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve live authority SHA
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            expected_sha="$(git rev-parse FETCH_HEAD)"
            basis="CURRENT_PR_BASE_CANONICAL_HEAD"
          else
            expected_sha="$GITHUB_SHA"
            basis="CANONICAL_PUSH_HEAD"
          fi
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "basis=$basis" >> "$GITHUB_OUTPUT"
          echo "R192 live proof expects $basis at $expected_sha"

      - name: Wait for two consecutive coherent R192 edge snapshots
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_SHA: ${{ steps.authority.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          stable=0
          for attempt in $(seq 1 90); do
            proof="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            rm -f /tmp/r191.json /tmp/r192-root.headers /tmp/r192-root.html /tmp/r192-api.headers /tmp/r192-api.json
            if curl --fail --silent --show-error --max-time 20 "$LIVE/api/fabric/r191/manifest?edgeProof=$proof" -o /tmp/r191.json \
              && curl --fail --silent --show-error --max-time 20 -D /tmp/r192-root.headers "$LIVE/?edgeProof=$proof" -o /tmp/r192-root.html \
              && curl --fail --silent --show-error --max-time 20 -D /tmp/r192-api.headers "$LIVE/api/fabric/r191/status?edgeProof=$proof" -o /tmp/r192-api.json \
              && EXPECTED_SHA="$EXPECTED_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads(Path('/tmp/r191.json').read_text())
          api=json.loads(Path('/tmp/r192-api.json').read_text())
          root_headers=Path('/tmp/r192-root.headers').read_text().lower()
          api_headers=Path('/tmp/r192-api.headers').read_text().lower()
          root=Path('/tmp/r192-root.html').read_text()
          expected=os.environ['EXPECTED_SHA']
          if manifest.get('canonicalGitSha') != expected: raise SystemExit(1)
          if 'content-type: text/html' not in root_headers: raise SystemExit(1)
          if 'x-omega-navigation: r192-navigation-home-repair' not in root_headers: raise SystemExit(1)
          if 'id="omegaUniversalNavR192"' not in root: raise SystemExit(1)
          if 'Living Operator Field' not in root: raise SystemExit(1)
          if 'id="omegaLaunch" class="hidden"' not in root: raise SystemExit(1)
          if 'content-type: application/json' not in api_headers: raise SystemExit(1)
          if 'x-omega-navigation:' in api_headers: raise SystemExit(1)
          if api.get('ok') is False: raise SystemExit(1)
          PY
            then
              stable=$((stable + 1))
              echo "R192 coherent edge snapshot observed ($stable/2) on attempt $attempt."
              if [ "$stable" -ge 2 ]; then
                echo "R192_EDGE_COHERENCE_SETTLED $EXPECTED_SHA"
                break
              fi
            else
              stable=0
              echo "R192 edge snapshot not coherent yet (attempt $attempt/90)."
            fi
            if [ "$attempt" -eq 90 ]; then
              echo 'R192_LIVE_EDGE_COHERENCE_PROOF_FAILED'
              for f in /tmp/r191.json /tmp/r192-root.headers /tmp/r192-root.html /tmp/r192-api.headers /tmp/r192-api.json; do
                echo "--- $f"; cat "$f" 2>/dev/null || true
              done
              exit 1
            fi
            sleep 2
          done

      - name: Verify every primary human route with bounded per-route settle
        env:
          LIVE: https://omegav6.jeffdeweyeljefe.workers.dev
          EXPECTED_SHA: ${{ steps.authority.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          routes=(/ /fabric /instrument /truth /clouds /sai /compute /validate /convergence)
          for route in "${routes[@]}"; do
            safe=$(printf '%s' "$route" | tr '/ ' '__')
            route_ok=false
            for attempt in $(seq 1 20); do
              proof="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${safe}-${attempt}"
              if curl --fail --silent --show-error --max-time 20 -D "/tmp/${safe}.headers" "$LIVE$route?edgeProof=$proof" -o "/tmp/${safe}.html" \
                && grep -qi '^content-type: text/html' "/tmp/${safe}.headers" \
                && grep -qi '^x-omega-navigation: r192-navigation-home-repair' "/tmp/${safe}.headers" \
                && grep -F 'id="omegaUniversalNavR192"' "/tmp/${safe}.html" >/dev/null; then
                route_ok=true
                break
              fi
              sleep 2
            done
            if [ "$route_ok" != true ]; then
              echo "R192_ROUTE_NOT_COHERENT $route"
              cat "/tmp/${safe}.headers" 2>/dev/null || true
              head -c 1400 "/tmp/${safe}.html" 2>/dev/null || true
              exit 1
            fi
          done

          grep -F 'Living Operator Field' /tmp/_.html
          grep -F 'id="omegaLaunch" class="hidden"' /tmp/_.html
          grep -F 'OMEGA · R191 SURFACE FABRIC' /tmp/_fabric.html

          echo "R192_NAVIGATION_HOME_LIVE_VERIFIED $EXPECTED_SHA"

      - name: Publish R192 coherence proof summary
        if: always()
        env:
          EXPECTED_SHA: ${{ steps.authority.outputs.expected_sha }}
          BASIS: ${{ steps.authority.outputs.basis }}
        shell: bash
        run: |
          {
            echo '## OMEGA V6 R192 navigation coherence proof'
            echo
            echo "- Authority basis: \`$BASIS\`"
            echo "- Expected canonical SHA: \`$EXPECTED_SHA\`"
            echo '- Exact-SHA manifest + HTML + JSON boundary: two consecutive coherent snapshots required'
            echo '- Primary human routes: bounded per-route settle; assertions are never weakened'
            echo '- JSON/API navigation injection: forbidden'
          } >> "$GITHUB_STEP_SUMMARY"
