name: OMEGA V6 R198 guarded production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - omega-v6-full-convergence
    paths:
      - .github/workflows/omega-v6-r198-production-deploy.yml

concurrency:
  group: omega-v6-production
  cancel-in-progress: false

jobs:
  verify-deploy-prove:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Full Sovereign preservation and R198 truth contract
        working-directory: canonforge-omega
        run: |
          python -m pip install -U pip pytest
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm install

      - name: Typecheck preserved Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        run: npm run typecheck

      - name: Wrangler dry run
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Deploy canonical Worker
        working-directory: canonforge-omega/cloudflare/omega-v6-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Prove R198 live SAR truth route
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS --max-time 45 'https://omegav6.jeffdeweyeljefe.workers.dev/api/earth/sar/r198/sources' || true)"
            if printf '%s' "$BODY" | grep -q 'r198-real-public-sar-truth-fusion' && printf '%s' "$BODY" | grep -q 'no_invented_coordinates'; then
              printf '%s\n' "$BODY" > r198-live-proof.json
              exit 0
            fi
            sleep 5
          done
          echo 'R198_LIVE_PROOF_FAILED'
          exit 1

      - name: Prove canonical UI contains R198 instrument
        run: |
          curl -fsS --max-time 45 'https://omegav6.jeffdeweyeljefe.workers.dev/?app=Earth' | grep -q 'omegaSarTruthR198Runtime'
