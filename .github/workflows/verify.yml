name: OMEGA Genesis Verify

on:
  push:
    branches: [omega-genesis-v1-full]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip pytest
          pip install -e .

      - name: Compile Python
        run: python -m compileall -q omega_genesis

      - name: Run Genesis tests
        run: pytest

      - name: Validate Worker syntax
        working-directory: cloudflare/omega-genesis-worker
        run: |
          npm install --package-lock=false
          npm run check

      - name: Regenerate canonical build ledger
        run: python scripts/build_manifest.py

      - name: Verify regenerated manifest
        run: python scripts/verify_release.py

      - name: Assert manifest generator is stable
        run: |
          cp omega.manifest.json /tmp/omega.manifest.first.json
          cp SHA256SUMS.txt /tmp/SHA256SUMS.first.txt
          python scripts/build_manifest.py
          diff -u /tmp/omega.manifest.first.json omega.manifest.json
          diff -u /tmp/SHA256SUMS.first.txt SHA256SUMS.txt

      - name: Build deterministic release
        run: python scripts/build_release.py

      - name: Rebuild deterministic release
        run: |
          cp release/OMEGA_Genesis_v1_1_0_Full_Repository.zip /tmp/omega-release-first.zip
          python scripts/build_release.py
          cmp /tmp/omega-release-first.zip release/OMEGA_Genesis_v1_1_0_Full_Repository.zip

      - name: Upload verified release
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-Genesis-v1.1.0
          path: |
            release/OMEGA_Genesis_v1_1_0_Full_Repository.zip
            release/OMEGA_Genesis_v1_1_0_Full_Repository.zip.sha256
          if-no-files-found: error
