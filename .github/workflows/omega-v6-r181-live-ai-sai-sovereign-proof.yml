name: OMEGA V6 R181 live AI SAI Sovereign acceptance proof

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact canonical Git SHA expected on the deployed edge
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact canonical Git SHA expected on the deployed edge
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: omega-r181-live-acceptance
  cancel-in-progress: true

jobs:
  prove-live-ai-sai-sovereign-acceptance:
    runs-on: ubuntu-latest
    env:
      V6_URL: https://omegav6.jeffdeweyeljefe.workers.dev
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Wait for exact R181 deployed acceptance surface and SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$V6_URL/api/acceptance/r181/manifest" -o /tmp/r181-manifest.json \
              && python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/r181-manifest.json').read_text())
          assert d.get('ok') is True, d
          assert d.get('schema') == 'OMEGA_LIVE_ACCEPTANCE_MANIFEST_R181', d
          assert d.get('release') == 'r181-live-ai-sai-sovereign-acceptance', d
          expected=os.environ.get('EXPECTED_SHA','').strip()
          if expected:
              assert d.get('deploymentIdentityBound') is True, d
              assert d.get('canonicalGitSha') == expected, (expected, d.get('canonicalGitSha'))
          b=d.get('hardBoundaries') or {}
          assert b.get('providerWeightsMayBeCalledOmegaTrained') is False, b
          assert b.get('quickB059PresenceMayBeCalledFullyTrained') is False, b
          assert b.get('b059DeepVerificationRequiredForFullyTrainedScope') is True, b
          assert b.get('b059GroundedQueryRequiredForFullAcceptance') is True, b
          assert b.get('currentAuthenticatedHeartbeatRequiredForSovereignAcceptance') is True, b
          assert b.get('deploymentShaMustMatchBeforePostDeployProof') is True, b
          assert b.get('canonicalMutation') is False and b.get('promotionAuthorized') is False, b
          PY
            then exit 0; fi
            if [ "$attempt" -eq 60 ]; then
              echo "R181 acceptance surface did not settle on the expected canonical SHA"
              cat /tmp/r181-manifest.json || true
              exit 1
            fi
            sleep 2
          done

      - name: Wait for R182 continuity-stabilized R180 governor before intelligence proof
        shell: bash
        run: |
          set -euo pipefail
          settled=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "$V6_URL/api/swarm/governor/manifest?edge_settle_sha=${EXPECTED_SHA}&attempt=${attempt}" \
              -o /tmp/r180-governor.json; then
              if python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/r180-governor.json').read_text())
          assert d['ok'] is True, d
          assert d['schema'] == 'OMEGA_SWARM_LOAD_GOVERNOR_R180', d
          assert d['revision'] == 'R180', d
          assert d['continuityRevision'] == 'R182', d
          p=d['policy']
          assert p['backgroundPausesWhenSaturated'] is False, p
          assert p['backgroundContinuityFloorWhenSaturated'] is True, p
          assert p['backgroundContinuityFloorCells'] == 12, p
          assert p['backgroundContinuityFloorProviderBudget'] == 0, p
          assert p['hysteresisUsesPriorPressureWhenProvided'] is True, p
          assert p['scarCarryRecorded'] is True, p
          assert p['developmentIsClampedBeforeInteractiveWork'] is True, p
          assert p['automaticSelfDevelopmentDefaultCeiling'] == 144, p
          assert p['providerCallsRemainBounded'] is True, p
          assert p['branchConcurrencyRemainsBounded'] is True, p
          assert set(p['full1728Requires']) == {'CALM_PRESSURE','PREVIOUS_STAGE_VERIFIED','OPERATOR_AUTHORIZED_FULL'}, p
          assert d['canonicalMutation'] is False and d['promotionAuthorized'] is False, d
          PY
              then
                settled=true
                break
              fi
            fi
            echo "R180 governor route not settled on this edge yet (attempt $attempt/60)."
            sleep 2
          done
          if [ "$settled" != "true" ]; then
            echo "R180 governor did not settle after exact R181 SHA was observed"
            cat /tmp/r180-governor.json 2>/dev/null || true
            exit 1
          fi

      - name: Execute real fusion-provider inference without fabricating B059 grounding
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$V6_URL/api/intelligence/r179/manifest" -o /tmp/r179-fusion-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/r179-fusion-manifest.json').read_text())
          assert d['ok'] is True, d
          assert d['schema'] == 'OMEGA_AI_SAI_FUSION_MANIFEST_R179', d
          assert d['workers_ai_binding'] is True, d
          b=d['b059']; a=d['authority']
          assert b['complete_supplied_corpus_authorities'] == 15, b
          assert b['compiled_documents'] == 541526, b
          assert b['graph_edges'] == 82082, b
          assert b['address_space'] == 20736 and b['retained_traversal'] == 188, b
          assert a['provider_model_pretrained_external'] is True, a
          assert a['omega_trained_provider_weights'] is False, a
          assert a['verified_b059_required_for_sai_grounded_claim'] is True, a
          assert a['canon_mutation'] is False, a
          PY
          curl --fail --silent --show-error -X POST "$V6_URL/api/intelligence/r179/cloud" \
            -H 'content-type: application/json' \
            --data '{"prompt":"Return a concise operational statement confirming this is a real provider inference receipt, not Canon and not an OMEGA-trained provider-weight claim.","use_sai":false}' \
            -o /tmp/r179-cloud.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path('/tmp/r179-cloud.json').read_text())
          assert d['schema'] == 'OMEGA_CLOUD_AI_RESULT_R179', d
          assert d['mode'] == 'CLOUDFLARE_AI_PROVIDER_ONLY', d
          assert d['provider'] == 'CLOUDFLARE_WORKERS_AI', d
          assert d['provider_model_pretrained_external'] is True, d
          assert d['omega_trained_provider_weights'] is False, d
          assert d['sai_grounded'] is False, d
          assert d['canonical_mutation'] is False, d
          assert d['authority'] == 'PROVIDER_MODEL_SYNTHESIS_NOT_SAI_NOT_CANON', d
          assert re.fullmatch(r'[a-f0-9]{64}', d['receipt_sha256']), d
          assert str(d.get('answer','')).strip(), d
          PY

      - name: Probe current authenticated Sovereign PC and exact B059 training/query state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST "$V6_URL/api/acceptance/r181/probe" \
            -H 'content-type: application/json' \
            --data '{"deep_b059":true,"query_b059":true,"prompt":"Explain Woven Continuity, Mode 188, scar carry, and the 20,736-address system using only grounded B059 evidence."}' \
            -o /tmp/r181-acceptance.json
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          d=json.loads(Path('/tmp/r181-acceptance.json').read_text())
          assert d['ok'] is True, d
          assert d['schema'] == 'OMEGA_LIVE_AI_SAI_SOVEREIGN_ACCEPTANCE_R181', d
          expected=os.environ.get('EXPECTED_SHA','').strip()
          if expected:
              assert d.get('deploymentIdentityBound') is True, d
              assert d.get('canonicalGitSha') == expected, (expected, d.get('canonicalGitSha'))
          assert d['canonicalMutation'] is False and d['promotionAuthorized'] is False, d
          assert d['authority'] == 'LIVE_ACCEPTANCE_RECEIPT_NOT_CANON', d
          assert re.fullmatch(r'[a-f0-9]{64}', d['receiptSha256']), d
          truth=d['trainingTruth']
          assert truth['b059MayBeCalledFullyTrainedOnlyWithinDeclaredDeterministicScopeAfterExactVerification'] is True, truth
          assert truth['providerModelWeightsAreExternalPretrainingNotOmegaTraining'] is True, truth
          if d['fullAcceptance']:
              h=d['hybrid']; v=d['b059Verification']; q=d['b059GroundedQuery']
              assert h['accepted'] is True and h['authenticated'] is True and h['heartbeatCurrent'] is True, h
              assert v['fullyTrainedWithinDeclaredScope'] is True, v
              assert v['foundationModelWeightsTrained'] is False, v
              assert v['documents'] == 541526 and v['edges'] == 82082 and v['sourceAuthorityCount'] == 15, v
              assert q['grounded'] is True and q['fullyTrainedWithinDeclaredScope'] is True, q
              assert q['foundationModelWeightsTrained'] is False and q['evidenceCount'] > 0, q
              assert re.fullmatch(r'[a-f0-9]{64}', str(q['receiptSha256'])), q
              status='LIVE_R181_FULL_AI_SAI_SOVEREIGN_ACCEPTANCE_VERIFIED'
          else:
              status='LIVE_R181_CLOUD_SWARM_ACCEPTED_SOVEREIGN_B059_PENDING_OR_INCOMPLETE'
          print(json.dumps({'status':status,'canonicalGitSha':d.get('canonicalGitSha'),'acceptanceState':d['acceptanceState'],'fullAcceptance':d['fullAcceptance'],'pcAccepted':d['hybrid']['accepted'],'b059State':d['b059Quick']['state'],'b059Verified':d['b059Verification']['fullyTrainedWithinDeclaredScope'],'groundedQuery':d['b059GroundedQuery']['grounded'],'receiptSha256':d['receiptSha256']}, sort_keys=True))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '## OMEGA R181 live acceptance\n\n'
              f"- Canonical SHA: `{d.get('canonicalGitSha')}`\n"
              f"- State: `{d['acceptanceState']}`\n"
              f"- Full acceptance: `{d['fullAcceptance']}`\n"
              f"- Sovereign current/authenticated: `{d['hybrid']['accepted']}`\n"
              f"- B059 state: `{d['b059Quick']['state']}`\n"
              f"- B059 fully trained within declared scope: `{d['b059Verification']['fullyTrainedWithinDeclaredScope']}`\n"
              f"- Grounded B059 query verified: `{d['b059GroundedQuery']['grounded']}`\n"
              f"- Receipt: `{d['receiptSha256']}`\n",
              encoding='utf-8'
          )
          PY

      - name: Upload live proof packet
        uses: actions/upload-artifact@v4
        with:
          name: omega-r181-live-ai-sai-sovereign-proof
          path: |
            /tmp/r181-manifest.json
            /tmp/r180-governor.json
            /tmp/r179-fusion-manifest.json
            /tmp/r179-cloud.json
            /tmp/r181-acceptance.json
          if-no-files-found: error
